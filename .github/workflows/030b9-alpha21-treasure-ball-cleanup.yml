name: Build Chainacobblemon 0.3.0-alpha.21 Treasure Ball Cleanup

on:
  push:
    branches:
      - release/0.3.0-alpha.21
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.20 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9297741447/zip' \
            -o /tmp/alpha20-artifact.zip
          rm -rf /tmp/alpha20-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha20-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha20-artifact.zip -d /tmp/alpha20-artifact
          srczip="$(find /tmp/alpha20-artifact -name 'Chainacobblemon-0.3.0-alpha.20-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply alpha.21 Treasure fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/alpha21/apply.py
          grep -q 'mod_version=0.3.0-alpha.21+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Compile Chainacobblemon alpha.21
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.21 Treasure fixes
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.21*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.21' fabric.mod.json
          grep -q 'execute in ' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java
          grep -q 'npc.discard()' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java
          grep -q 'Treasure ball spawn verification failed' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.21*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.21+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.21-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.21+1.21.1.jar Chainacobblemon-0.3.0-alpha.21-source.zip > SHA256SUMS-0.3.0-alpha.21.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.21
          path: /tmp/out/*
