name: Verify ChainaBridge 0.4.0-alpha.9 Support Rewards

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  verify-chainabridge-alpha9:
    if: github.head_ref == 'release/chainabridge-0.4.0-alpha.9'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify alpha.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/040b9/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChainaBridge-0.4.0-alpha.9-Support-Rewards
          path: /tmp/chainabridge-alpha9-out/*
          if-no-files-found: error
          retention-days: 90
