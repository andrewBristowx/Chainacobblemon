name: Build Chainacobblemon 0.4.0-alpha.33 Lulita Duber Duo

on:
  push:
    branches:
      - release/0.4.0-alpha.33
    paths:
      - 'ci/040a33/**'
      - '.github/workflows/040a33-lulita-duber-duo.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.33
        run: bash ci/040a33/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.33-Lulita-Duber-Duo
          path: /tmp/alpha33-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.33 to dist
        run: |
          set -euxo pipefail
          rm -rf dist/alpha33
          mkdir -p dist/alpha33
          cp /tmp/alpha33-out/* dist/alpha33/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha33/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha33/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha33
          git commit -m 'build: publish verified alpha33 artifacts'
          git push origin HEAD:release/0.4.0-alpha.33
