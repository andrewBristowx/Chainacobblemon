name: Build Chainacobblemon 0.4.0-alpha.11 TAB Ranks Chat

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore authoritative alpha.5 source
        run: |
          set -euxo pipefail
          test -f dist/040a5/Chainacobblemon-0.4.0-alpha.5-source.zip
          rm -rf /tmp/chainacobblemon
          mkdir -p /tmp/chainacobblemon
          unzip -q dist/040a5/Chainacobblemon-0.4.0-alpha.5-source.zip -d /tmp/chainacobblemon
          grep -q '0.4.0-alpha.5+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Restore validated alpha.6 onboarding
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a6_twitch_onboarding.patch"

      - name: Restore validated alpha.7 direct link
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a7_direct_twitch_link.patch"

      - name: Restore validated alpha.8 Twitch admin
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          for p in "$GITHUB_WORKSPACE"/ci/040a8/*.patch; do patch -p1 < "$p"; done

      - name: Restore validated alpha.9 stream bonuses
        run: |
          set -euxo pipefail
          cat \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part0" \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part1" \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part2" \
            > /tmp/040a9.patch
          cd /tmp/chainacobblemon
          patch -p1 < /tmp/040a9.patch
          sed -i 's/Stats\.INSTANCE\.getPERMANENT()/Stats.Companion.getPERMANENT()/g' \
            src/main/java/com/andrewbristowx/chainacobblemon/twitch/StreamBonusService.java

      - name: Restore validated alpha.10 Styled Player List
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a10_styled_player_list.patch"

      - name: Apply alpha.11 TAB ranks and chat
        run: |
          set -euxo pipefail
          cat \
            "$GITHUB_WORKSPACE/ci/040a11/alpha11.part0" \
            "$GITHUB_WORKSPACE/ci/040a11/alpha11.part1" \
            "$GITHUB_WORKSPACE/ci/040a11/alpha11.part2" \
            > /tmp/040a11.patch
          cd /tmp/chainacobblemon
          patch -p1 < /tmp/040a11.patch
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a11/alpha11-fix-import.patch"

      - name: Verify alpha.11 source contract
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          MAIN=src/main/java/com/andrewbristowx/chainacobblemon/Chainacobblemon.java
          CONFIG=src/main/java/com/andrewbristowx/chainacobblemon/config/ChainacobblemonConfig.java
          SPL=src/main/java/com/andrewbristowx/chainacobblemon/twitch/StyledPlayerListIntegration.java
          CHAT=src/main/java/com/andrewbristowx/chainacobblemon/twitch/StyledChatIntegration.java
          LP=src/main/java/com/andrewbristowx/chainacobblemon/twitch/LuckPermsBootstrap.java
          RANK=src/main/java/com/andrewbristowx/chainacobblemon/twitch/RankDisplayService.java
          TAB=src/client/java/com/andrewbristowx/chainacobblemon/client/twitch/ChainaTabDecoration.java
          SNAP=src/main/java/com/andrewbristowx/chainacobblemon/twitch/TwitchSnapshot.java

          grep -q 'mod_version=0.4.0-alpha.11+1.21.1' gradle.properties
          grep -q '0.4.0-alpha.11+1.21.1' "$MAIN"
          grep -q 'configVersion = 15' "$CONFIG"
          grep -q 'styledPlayerListTabEmotes = true' "$CONFIG"
          grep -q 'styledChatAutoConfigure = true' "$CONFIG"
          grep -q 'luckPermsAutoConfigure = true' "$CONFIG"

          grep -q 'chainacobblemon:styled_name' "$SPL"
          grep -q 'chaina_tab_cute' "$SPL"
          grep -q 'chaina_tab_awa' "$SPL"
          grep -q 'chainavtCute' CHANGELOG.md
          grep -q 'Hosting gracias a' "$SPL"
          ! grep -q 'Vincula tu Twitch para recibir tus beneficios' "$SPL"

          grep -q 'styled-chat.json.chaina-backup' "$CHAT"
          grep -q 'styledchat reload' "$CHAT"
          grep -q '%chainacobblemon:styled_name%' "$CHAT"

          grep -q 'LuckPermsProvider' "$LP"
          grep -q 'modifyGroup' "$LP"
          grep -q 'chainacobblemon.twitch.sub.3' "$LP"
          grep -q 'getInheritedGroups' "$LP"
          grep -q 'SUB " + roman' "$RANK"

          grep -q 'TwitchSnapshot' "$TAB"
          grep -q 'ClientVisualAssetCache' "$TAB"
          grep -q 'styledPlayerListIntegrated' "$SNAP"
          grep -q '"styledchat"' src/main/resources/fabric.mod.json

      - name: Compile and package alpha.11
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify final JAR
        run: |
          set -euxo pipefail
          JAR=/tmp/chainacobblemon/build/libs/Chainacobblemon-0.4.0-alpha.11+1.21.1.jar
          test -s "$JAR"
          for cls in \
            com/andrewbristowx/chainacobblemon/twitch/StyledPlayerListIntegration.class \
            com/andrewbristowx/chainacobblemon/twitch/StyledChatIntegration.class \
            com/andrewbristowx/chainacobblemon/twitch/LuckPermsBootstrap.class \
            com/andrewbristowx/chainacobblemon/twitch/RankDisplayService.class \
            com/andrewbristowx/chainacobblemon/client/twitch/ChainaTabDecoration.class \
            com/andrewbristowx/chainacobblemon/twitch/StreamBonusService.class
          do
            jar tf "$JAR" | grep -q "$cls"
          done
          jar tf "$JAR" | grep -q 'META-INF/jars/placeholder-api'
          unzip -p "$JAR" fabric.mod.json | grep -q '0.4.0-alpha.11+1.21.1'
          unzip -p "$JAR" fabric.mod.json | grep -q 'styledplayerlist'
          unzip -p "$JAR" fabric.mod.json | grep -q 'styledchat'
          unzip -p "$JAR" fabric.mod.json | grep -q 'luckperms'

      - name: Prepare authoritative artifact
        run: |
          set -euxo pipefail
          OUT=/tmp/alpha11-out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/chainacobblemon/build/libs/Chainacobblemon-0.4.0-alpha.11+1.21.1.jar "$OUT/"
          cd /tmp/chainacobblemon
          zip -qr "$OUT/Chainacobblemon-0.4.0-alpha.11-source.zip" . -x 'build/*' '.gradle/*'
          cat > "$OUT/README-ALPHA11.txt" <<'EOF'
          Chainacobblemon 0.4.0-alpha.11 - Chaina TAB v2 + LuckPerms + Styled Chat

          Keep using ChainaBridge 0.4.0-alpha.7. No new Twitch authorization is required.

          Styled Player List:
          - Migrates the Chainacobblemon-managed `chaina` style to v2 and backs up the alpha.10 managed style.
          - Removes the duplicate Twitch-link reminder from TAB.
          - Shows a more decorated Chaina header/footer, live state, stream bonuses and connected trainers.
          - Uses `%chainacobblemon:styled_name%` for player names.
          - Downloads/caches chainavtCute and chainavtAwa on the server and sends them through Chainacobblemon visual assets.
          - Client-side Chainacobblemon renders those emotes while TAB is held.
          - Install the same alpha.11 JAR on server and clients for TAB emote rendering.

          LuckPerms:
          - Optional and non-destructive.
          - Creates/loads only Chainacobblemon Twitch groups configured in the mod.
          - Default chain: twitch -> sub_chaina -> sub_chaina_plus -> sub_chaina_plus_plus.
          - Adds Chainacobblemon Twitch permissions and inheritance only.
          - Never changes the player's primary group.
          - SUB badge remains secondary to ADMIN/MOD/VIP/DONADOR/JUGADOR display.

          Styled Chat:
          - One-time auto-configuration when the mod is detected.
          - Original `config/styled-chat.json` is copied to `styled-chat.json.chaina-backup`.
          - Uses the same `%chainacobblemon:styled_name%` rank/name presentation as TAB.
          - Existing unrelated chat settings and emote features are kept.
          - A marker prevents Chainacobblemon from overwriting later manual Styled Chat changes.

          Default visual rank colors:
          ADMIN pink, MOD aqua, VIP gold, DONADOR green, JUGADOR gray/white.
          SUB I lavender, SUB II pink, SUB III gold.

          Stream bonuses from alpha.9 and Twitch linking/admin flow from alpha.6-alpha.8 remain unchanged.
          EOF
          cd "$OUT"
          sha256sum Chainacobblemon-0.4.0-alpha.11+1.21.1.jar Chainacobblemon-0.4.0-alpha.11-source.zip > SHA256SUMS-0.4.0-alpha.11.txt
          ls -lh

      - name: Upload alpha.11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.11-TAB-Ranks-Chat
          path: /tmp/alpha11-out/*
          if-no-files-found: error
          retention-days: 90
