name: Build Chainacobblemon 0.3.0-alpha.15 Chaina Events

on:
  push:
    branches:
      - release/0.3.0-alpha.15
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.14 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9276631491/zip' \
            -o /tmp/alpha14-artifact.zip
          rm -rf /tmp/alpha14-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha14-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha14-artifact.zip -d /tmp/alpha14-artifact
          srczip="$(find /tmp/alpha14-artifact -name 'Chainacobblemon-0.3.0-alpha.14-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply alpha.15 Chaina Events overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/alpha15/overlay.part00 ci/alpha15/overlay.part01 ci/alpha15/overlay.part02 ci/alpha15/overlay.part03 ci/alpha15/overlay.part04 ci/alpha15/overlay.part05 ci/alpha15/overlay.part06 ci/alpha15/overlay.part07 ci/alpha15/overlay.part08 ci/alpha15/overlay.part09 | base64 -d > /tmp/alpha15-overlay.tar.gz
          tar -xzf /tmp/alpha15-overlay.tar.gz -C /tmp/chainacobblemon
          grep -q '0.3.0-alpha.15' /tmp/chainacobblemon/gradle.properties

      - name: Compile Chainacobblemon alpha.15
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.15 Chaina Events
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.15*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.15' fabric.mod.json
          test -f com/andrewbristowx/chainacobblemon/events/ChainaEventManager.class
          test -f com/andrewbristowx/chainacobblemon/events/EventCommands.class
          test -f com/andrewbristowx/chainacobblemon/events/EventRewardService.class
          test -f com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.class
          test -f com/andrewbristowx/chainacobblemon/dungeon/ChainaDungeonLootService.class
          test -f com/andrewbristowx/chainacobblemon/dungeon/TreasureStructureCatalog.class
          test -f com/andrewbristowx/chainacobblemon/client/events/EventClient.class
          test -f com/andrewbristowx/chainacobblemon/client/events/BeautyGameScreen.class
          javap -classpath "/tmp/chainacobblemon/$jarfile" -c -p com.andrewbristowx.chainacobblemon.events.ChainaEventManager > /tmp/events15.javap
          javap -classpath "/tmp/chainacobblemon/$jarfile" -c -p com.andrewbristowx.chainacobblemon.events.EventCommands > /tmp/eventcmd15.javap
          javap -classpath "/tmp/chainacobblemon/$jarfile" -c -p com.andrewbristowx.chainacobblemon.dungeon.ChainaDungeonLootService > /tmp/dloot15.javap
          grep -q 'Concurso de Pesca Chaina' /tmp/events15.javap
          grep -q 'claimTreasure' /tmp/events15.javap
          grep -q 'beautyMove' /tmp/events15.javap
          grep -q 'treasure' /tmp/eventcmd15.javap
          grep -q 'spawnSpecific' /tmp/eventcmd15.javap
          grep -q 'Chaina Dungeon Loot' /tmp/dloot15.javap

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.15*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.15+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.15-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.15+1.21.1.jar Chainacobblemon-0.3.0-alpha.15-source.zip > SHA256SUMS-0.3.0-alpha.15.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.15
          path: /tmp/out/*
