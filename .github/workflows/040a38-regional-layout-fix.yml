name: 0.4.0-alpha.38 Regional Layout Watchdog fix

on:
  push:
    branches:
      - release/0.4.0-alpha.38
    paths:
      - 'ci/040a38/**'
      - '.github/workflows/040a38-regional-layout-fix.yml'
  pull_request:
    branches:
      - release/0.4.0-alpha.36
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha38 carrier branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build verified alpha38 from alpha36 dist source
        run: bash ci/040a38/ci.sh

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.38-Regional-Layout-Fix
          path: /tmp/alpha38-out/*

      - name: Publish verified dist files
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist/alpha38
          mkdir -p dist/alpha38
          cp /tmp/alpha38-out/* dist/alpha38/
          printf '%s\n' "${GITHUB_RUN_ID}" > dist/alpha38/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha38/BUILD_STATUS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/alpha38
          git commit -m 'build: publish verified alpha38 artifacts' || exit 0
          git push origin HEAD:release/0.4.0-alpha.38
