name: Build Chainacobblemon 0.4.0-alpha.9 Stream Bonuses HUD

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore authoritative alpha.5 source
        run: |
          set -euxo pipefail
          test -f dist/040a5/Chainacobblemon-0.4.0-alpha.5-source.zip
          rm -rf /tmp/chainacobblemon
          mkdir -p /tmp/chainacobblemon
          unzip -q dist/040a5/Chainacobblemon-0.4.0-alpha.5-source.zip -d /tmp/chainacobblemon
          test -f /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/twitch/TwitchService.java
          grep -q '0.4.0-alpha.5+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Restore validated alpha.6 onboarding
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a6_twitch_onboarding.patch"

      - name: Restore validated alpha.7 direct link
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a7_direct_twitch_link.patch"

      - name: Restore validated alpha.8 Twitch admin
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          for p in "$GITHUB_WORKSPACE"/ci/040a8/*.patch; do
            echo "Applying $p"
            patch -p1 < "$p"
          done

      - name: Apply alpha.9 stream bonus implementation
        run: |
          set -euxo pipefail
          cat \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part0" \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part1" \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part2" \
            > /tmp/040a9-stream-bonuses.patch
          cd /tmp/chainacobblemon
          patch -p1 < /tmp/040a9-stream-bonuses.patch

      - name: Verify alpha.9 source contract
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          MAIN=src/main/java/com/andrewbristowx/chainacobblemon/Chainacobblemon.java
          SERVICE=src/main/java/com/andrewbristowx/chainacobblemon/twitch/StreamBonusService.java
          TWITCH=src/main/java/com/andrewbristowx/chainacobblemon/twitch/TwitchService.java
          HUD=src/client/java/com/andrewbristowx/chainacobblemon/client/twitch/TwitchStatusHud.java
          COMMANDS=src/main/java/com/andrewbristowx/chainacobblemon/twitch/TwitchCommands.java
          grep -q 'mod_version=0.4.0-alpha.9+1.21.1' gradle.properties
          grep -q '0.4.0-alpha.9+1.21.1' "$MAIN"
          grep -q 'SHINY_CHANCE_CALCULATION' "$SERVICE"
          grep -q 'POKEMON_ENTITY_SPAWN' "$SERVICE"
          grep -q 'stream-bonus-state.json' "$SERVICE"
          grep -q 'PokemonProperties.Companion.parse' "$SERVICE"
          grep -q 'pokemon.setIV' "$SERVICE"
          grep -q 'streamJackpotChance' src/main/java/com/andrewbristowx/chainacobblemon/config/ChainacobblemonConfig.java
          grep -q 'streamBonusesActive' "$TWITCH"
          grep -q 'DIRECTO LEGENDARIO' "$TWITCH"
          grep -q 'CHAINA EN VIVO' "$HUD"
          grep -q 'CHAINA OFFLINE' "$HUD"
          grep -q 'literal("bonus")' "$COMMANDS"
          grep -q 'literal("reroll")' "$COMMANDS"
          grep -q 'literal("admin")' "$COMMANDS"
          grep -q 'player.hasPermissionLevel(2)' "$TWITCH"

      - name: Compile and package alpha.9
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify final JAR
        run: |
          set -euxo pipefail
          JAR=/tmp/chainacobblemon/build/libs/Chainacobblemon-0.4.0-alpha.9+1.21.1.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainacobblemon/twitch/StreamBonusService.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainacobblemon/twitch/TwitchService.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainacobblemon/twitch/TwitchCommands.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainacobblemon/client/twitch/TwitchStatusHud.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainacobblemon/client/twitch/TwitchScreen.class'
          unzip -p "$JAR" fabric.mod.json | grep -q '0.4.0-alpha.9+1.21.1'

      - name: Prepare authoritative artifact
        run: |
          set -euxo pipefail
          OUT=/tmp/alpha9-out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/chainacobblemon/build/libs/Chainacobblemon-0.4.0-alpha.9+1.21.1.jar "$OUT/"
          cd /tmp/chainacobblemon
          zip -qr "$OUT/Chainacobblemon-0.4.0-alpha.9-source.zip" . -x 'build/*' '.gradle/*'
          cat > "$OUT/README-ALPHA9.txt" <<'EOF'
          Chainacobblemon 0.4.0-alpha.9 - Random Chaina Stream Bonuses + HUD

          Keep using the already validated ChainaBridge 0.4.0-alpha.7.
          No new Twitch authorization is required for this mod build.

          Stream behavior:
          - Chaina OFFLINE: compact top-center OFFLINE HUD, stream bonuses inactive.
          - Chaina goes EN VIVO: bonuses are rolled once and persisted for that live session.
          - Normal stream: 3 unique random bonuses.
          - 5% default chance: DIRECTO LEGENDARIO with 4 stronger unique bonuses.
          - Bonuses are selected from Shiny, random Pokemon type, perfect IV, Legendary/Mythical and Rare/Epic boosts.
          - The same rolled set survives Minecraft/server restarts while the persisted live session remains active.
          - When Chaina goes offline the bonuses are cleared.

          Default tuning (configurable in Chainacobblemon config):
          - Shiny: x2 / x3 / x4 when selected.
          - Featured type conversion: 8% per eligible natural spawn (12% jackpot).
          - Perfect IV: 18% chance for one IV=31; conditional 4% for a second (stronger jackpot minimums).
          - Legendary/Mythical conversion: +0.08% per natural spawn (minimum +0.15% jackpot).
          - Rare/Epic promotion: +3.5% per eligible common/uncommon spawn (minimum +6% jackpot).

          Admin testing while Chaina is live:
          /chaina twitch bonus
          /chaina twitch bonus reroll

          This build works on dedicated servers and integrated singleplayer worlds. The gameplay bonuses are server-side; the HUD is client-side, so install the same alpha.9 JAR on both server and clients where applicable.
          EOF
          cd "$OUT"
          sha256sum Chainacobblemon-0.4.0-alpha.9+1.21.1.jar Chainacobblemon-0.4.0-alpha.9-source.zip > SHA256SUMS-0.4.0-alpha.9.txt
          ls -lh

      - name: Upload alpha.9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.9-Stream-Bonuses-HUD
          path: /tmp/alpha9-out/*
          if-no-files-found: error
          retention-days: 90
