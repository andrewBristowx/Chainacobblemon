name: Build Chainacobblemon 0.3.0-alpha.10 Tower proximity fix

on:
  push:
    branches:
      - release/0.3.0-alpha.10
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.9 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9273903324/zip' \
            -o /tmp/alpha9-artifact.zip
          mkdir -p /tmp/alpha9-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha9-artifact.zip -d /tmp/alpha9-artifact
          srczip="$(find /tmp/alpha9-artifact -name 'Chainacobblemon-0.3.0-alpha.9-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply Tower proximity hotfix and bump alpha.10
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/chainacobblemon')

          gp = root / 'gradle.properties'
          text = gp.read_text()
          text = text.replace('mod_version=0.3.0-alpha.9+1.21.1', 'mod_version=0.3.0-alpha.10+1.21.1')
          gp.write_text(text)

          svc = root / 'src/main/java/com/andrewbristowx/chainacobblemon/tower/ChallengeTowerService.java'
          text = svc.read_text()
          old = 'npc.refreshPositionAndAngles(session.laneX + 0.5D, floorY(floor), -5.5D, 0.0F, 0.0F);'
          new = 'npc.refreshPositionAndAngles(session.laneX + 0.5D, floorY(floor), -1.5D, 0.0F, 0.0F);'
          if old not in text:
              raise SystemExit('Tower trainer spawn coordinate pattern not found')
          svc.write_text(text.replace(old, new))

          battle = root / 'src/main/java/com/andrewbristowx/chainacobblemon/npc/NpcBattleService.java'
          text = battle.read_text()
          old = 'if (player.getWorld() != npc.getWorld() || player.squaredDistanceTo(npc) > 100.0D) {'
          new = 'if (player.getWorld() != npc.getWorld() || (!ChallengeTowerService.isTowerTrainer(npc) && player.squaredDistanceTo(npc) > 100.0D)) {'
          if old not in text:
              raise SystemExit('NPC proximity guard pattern not found')
          battle.write_text(text.replace(old, new))
          PY
          grep -q 'mod_version=0.3.0-alpha.10+1.21.1' /tmp/chainacobblemon/gradle.properties
          grep -q '!ChallengeTowerService.isTowerTrainer(npc)' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/npc/NpcBattleService.java
          grep -q 'floorY(floor), -1.5D' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/tower/ChallengeTowerService.java

      - name: Compile Chainacobblemon alpha.10
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Verify alpha.10 Tower fix jar
        shell: bash
        run: |
          set -euxo pipefail
          src=/tmp/chainacobblemon
          jar="$(find "$src/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.3.0-alpha.10+1.21.1'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/tower/ChallengeTowerService.class'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/npc/NpcBattleService.class'
          unzip -l "$jar" | grep -q 'assets/chainacobblemon/sounds/tower/badge_rush.ogg'
          unzip -l "$jar" | grep -q 'data/chainacobblemon/dimension/challenge_tower.json'
          mkdir -p /tmp/release
          cp "$jar" '/tmp/release/Chainacobblemon-0.3.0-alpha.10+1.21.1.jar'
          (cd "$src" && zip -qr '/tmp/release/Chainacobblemon-0.3.0-alpha.10-source.zip' . -x '.gradle/*' 'build/*')
          sha256sum \
            /tmp/release/Chainacobblemon-0.3.0-alpha.10+1.21.1.jar \
            /tmp/release/Chainacobblemon-0.3.0-alpha.10-source.zip \
            > /tmp/release/SHA256SUMS-0.3.0-alpha.10.txt
          cat /tmp/release/SHA256SUMS-0.3.0-alpha.10.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.10
          path: /tmp/release/*
