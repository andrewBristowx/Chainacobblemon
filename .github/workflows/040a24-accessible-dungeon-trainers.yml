name: Build Chainacobblemon 0.4.0-alpha.24 Accessible Dungeon Trainers

on:
  push:
    branches:
      - release/0.4.0-alpha.24
    paths:
      - 'ci/040a24/**'
      - '.github/workflows/040a24-accessible-dungeon-trainers.yml'
  pull_request:
    branches:
      - release/0.4.0-alpha.23
    paths:
      - 'ci/040a24/**'
      - '.github/workflows/040a24-accessible-dungeon-trainers.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.24
        run: bash ci/040a24/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.24-Accessible-Dungeon-Trainers
          path: /tmp/alpha24-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.24 to dist
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -rf dist/alpha24
          mkdir -p dist/alpha24
          cp /tmp/alpha24-out/* dist/alpha24/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha24/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha24/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha24
          git commit -m 'build: publish verified alpha24 artifacts'
          git push origin HEAD:release/0.4.0-alpha.24
