name: Build ChainaBridge 0.4.0-alpha.6 ChainaMinecraftBot EventSub

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore authoritative ChainaBridge alpha.5 source
        run: |
          set -euxo pipefail
          test -f dist/040a5/ChainaBridge-0.4.0-alpha.5-source.zip
          rm -rf /tmp/bridge-unzip /tmp/chainabridge
          mkdir -p /tmp/bridge-unzip
          unzip -q dist/040a5/ChainaBridge-0.4.0-alpha.5-source.zip -d /tmp/bridge-unzip
          if [ -d /tmp/bridge-unzip/bridge-alpha5 ]; then
            mv /tmp/bridge-unzip/bridge-alpha5 /tmp/chainabridge
          else
            mkdir -p /tmp/chainabridge
            cp -a /tmp/bridge-unzip/. /tmp/chainabridge/
          fi
          test -f /tmp/chainabridge/src/main/java/com/andrewbristowx/chainabridge/ChainaBridgeMain.java
          grep -q "version = '0.4.0-alpha.5'" /tmp/chainabridge/build.gradle
          grep -q 'AES-256-GCM ENCRYPTED DISK' /tmp/chainabridge/src/main/java/com/andrewbristowx/chainabridge/ChainaBridgeMain.java

      - name: Apply ChainaBridge alpha.6 EventSub implementation
        run: |
          set -euxo pipefail
          cd /tmp/chainabridge
          patch -p1 < "$GITHUB_WORKSPACE/ci/040b6/bridge_alpha6_support.patch"
          cat \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part0" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part1" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part2" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part3" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part4" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part5" \
            > src/main/java/com/andrewbristowx/chainabridge/BotEventSubService.java

      - name: Verify security and EventSub source contract
        run: |
          set -euxo pipefail
          cd /tmp/chainabridge
          MAIN=src/main/java/com/andrewbristowx/chainabridge/ChainaBridgeMain.java
          BOT=src/main/java/com/andrewbristowx/chainabridge/BotEventSubService.java
          grep -q '0.4.0-alpha.6' build.gradle
          grep -q '0.4.0-alpha.6' "$MAIN"
          grep -q 'ChainaMinecraftBot' "$BOT"
          grep -q 'user:read:chat' "$BOT"
          grep -q 'user:bot' "$BOT"
          grep -q 'channel.chat.message' "$BOT"
          grep -q 'channel.chat.notification' "$BOT"
          grep -q 'chainabridge-bot.enc' "$BOT"
          grep -q 'ChainaBridge-AES-GCM-bot-store-v1' "$BOT"
          grep -q 'EXPECTED_BOT_LOGIN = "chainaminecraftbot"' "$BOT"
          grep -q 'response.statusCode() != 202' "$BOT"
          grep -q 'eventsub.wss.twitch.tv/ws' "$BOT"
          grep -q 'Chaina OAuth token: NOT USED' "$MAIN"
          ! grep -qi 'bits:read' "$BOT"
          ! grep -qi 'channel:read:subscriptions' "$BOT"
          ! grep -qi 'client_secret' "$BOT"

      - name: Install Gradle 9.6.1
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -o /tmp/gradle-9.6.1-bin.zip
          unzip -q /tmp/gradle-9.6.1-bin.zip -d /tmp
          /tmp/gradle-9.6.1/bin/gradle --version

      - name: Compile ChainaBridge alpha.6
        run: |
          set -euxo pipefail
          cd /tmp/chainabridge
          /tmp/gradle-9.6.1/bin/gradle clean jar --no-daemon
          JAR=build/libs/ChainaBridge-0.4.0-alpha.6.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainabridge/ChainaBridgeMain.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainabridge/BotEventSubService.class'

      - name: Test encrypted player authorization persistence
        run: |
          set -euxo pipefail
          JAR=/tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.6.jar
          rm -rf /tmp/test-player-store
          mkdir -p /tmp/test-player-store
          cd /tmp/test-player-store
          java -jar "$JAR" --self-test-store | tee output.txt
          grep -q 'CHAINABRIDGE_ENCRYPTED_STORE_SELF_TEST_OK' output.txt
          test -s chainabridge-accounts.enc
          ! grep -q 'TOKEN-MUST-NOT-APPEAR' chainabridge-accounts.enc

      - name: Test encrypted bot authorization persistence
        run: |
          set -euxo pipefail
          JAR=/tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.6.jar
          rm -rf /tmp/test-bot-store
          mkdir -p /tmp/test-bot-store
          cd /tmp/test-bot-store
          java -jar "$JAR" --self-test-bot-store | tee output.txt
          grep -q 'CHAINABRIDGE_ENCRYPTED_BOT_STORE_SELF_TEST_OK' output.txt
          test -s chainabridge-bot.enc
          ! grep -q 'BOT_ACCESS_TOKEN_MUST_NOT_APPEAR_PLAINTEXT' chainabridge-bot.enc
          ! grep -q 'BOT_REFRESH_TOKEN_MUST_NOT_APPEAR_PLAINTEXT' chainabridge-bot.enc

      - name: Local HTTP smoke test
        run: |
          set -euxo pipefail
          JAR=/tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.6.jar
          rm -rf /tmp/test-http
          mkdir -p /tmp/test-http
          cd /tmp/test-http
          java -jar "$JAR" > bridge.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"version":"0.4.0-alpha.6"' health.json
          grep -q '"bot_linked":false' health.json
          curl -fsS http://127.0.0.1:8765/bot > bot.html
          grep -q 'ChainaMinecraftBot' bot.html
          grep -q 'user:read:chat' bot.html
          grep -q 'user:bot' bot.html
          kill $PID
          wait $PID || true
          trap - EXIT

      - name: Prepare release package
        run: |
          set -euxo pipefail
          OUT=/tmp/chainabridge-alpha6-out
          rm -rf "$OUT" /tmp/chainabridge-pack
          mkdir -p "$OUT" /tmp/chainabridge-pack
          cp /tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.6.jar "$OUT/"
          cp /tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.6.jar /tmp/chainabridge-pack/
          cp /tmp/chainabridge/INICIAR-CHAINABRIDGE.bat /tmp/chainabridge-pack/
          cp /tmp/chainabridge/README.md /tmp/chainabridge-pack/
          cd /tmp/chainabridge-pack
          zip -qr "$OUT/ChainaBridge-0.4.0-alpha.6-PACK.zip" .
          cd /tmp/chainabridge
          zip -qr "$OUT/ChainaBridge-0.4.0-alpha.6-source.zip" . -x 'build/*' '.gradle/*'
          cat > "$OUT/README-CHAINAMINECRAFTBOT.txt" <<'EOF'
          ChainaBridge 0.4.0-alpha.6 - ChainaMinecraftBot EventSub validation

          Keep your existing alpha.5 local files:
          chainabridge.properties
          chainabridge-keys.json
          chainabridge-master.key
          chainabridge-accounts.enc

          New after bot authorization:
          chainabridge-bot.enc

          Open after starting the bridge:
          http://127.0.0.1:8765/bot

          Authorize ONLY Twitch account ChainaMinecraftBot.
          Requested bot scopes: user:read:chat + user:bot.
          ChainaMinecraftBot must be MOD in chainavt.
          No Chaina OAuth token and no Client Secret are used.

          This validation build only logs/counts Bits/Cheers and subscription/gift chat notifications.
          It does not yet grant Minecraft rewards.
          EOF
          cd "$OUT"
          sha256sum ChainaBridge-0.4.0-alpha.6.jar ChainaBridge-0.4.0-alpha.6-PACK.zip ChainaBridge-0.4.0-alpha.6-source.zip > SHA256SUMS-0.4.0-alpha.6.txt
          ls -lh

      - name: Upload ChainaBridge alpha.6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainaBridge-0.4.0-alpha.6-ChainaMinecraftBot-EventSub
          path: /tmp/chainabridge-alpha6-out/*
          if-no-files-found: error
          retention-days: 90
