name: Build Chainacobblemon 0.4.0-alpha.10 Styled Player List

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore authoritative alpha.5 source
        run: |
          set -euxo pipefail
          test -f dist/040a5/Chainacobblemon-0.4.0-alpha.5-source.zip
          rm -rf /tmp/chainacobblemon
          mkdir -p /tmp/chainacobblemon
          unzip -q dist/040a5/Chainacobblemon-0.4.0-alpha.5-source.zip -d /tmp/chainacobblemon
          grep -q '0.4.0-alpha.5+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Restore validated alpha.6 onboarding
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a6_twitch_onboarding.patch"

      - name: Restore validated alpha.7 direct link
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a7_direct_twitch_link.patch"

      - name: Restore validated alpha.8 Twitch admin
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          for p in "$GITHUB_WORKSPACE"/ci/040a8/*.patch; do
            patch -p1 < "$p"
          done

      - name: Restore validated alpha.9 stream bonuses
        run: |
          set -euxo pipefail
          cat \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part0" \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part1" \
            "$GITHUB_WORKSPACE/ci/040a9/stream_bonuses.part2" \
            > /tmp/040a9-stream-bonuses.patch
          cd /tmp/chainacobblemon
          patch -p1 < /tmp/040a9-stream-bonuses.patch

      - name: Apply alpha.10 Styled Player List integration
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          patch -p1 < "$GITHUB_WORKSPACE/ci/040a10_styled_player_list.patch"

      - name: Verify alpha.10 source contract
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          MAIN=src/main/java/com/andrewbristowx/chainacobblemon/Chainacobblemon.java
          INTEGRATION=src/main/java/com/andrewbristowx/chainacobblemon/twitch/StyledPlayerListIntegration.java
          TWITCH=src/main/java/com/andrewbristowx/chainacobblemon/twitch/TwitchService.java
          CONFIG=src/main/java/com/andrewbristowx/chainacobblemon/config/ChainacobblemonConfig.java
          grep -q 'mod_version=0.4.0-alpha.10+1.21.1' gradle.properties
          grep -q '0.4.0-alpha.10+1.21.1' "$MAIN"
          grep -q 'eu.pb4:placeholder-api:2.4.2+1.21' build.gradle
          grep -q 'Placeholders.register' "$INTEGRATION"
          grep -q 'chainacobblemon:twitch_status' "$INTEGRATION"
          grep -q 'chainacobblemon:stream_bonuses' "$INTEGRATION"
          grep -q 'default_style' "$INTEGRATION"
          grep -q 'client_show_in_singleplayer' "$INTEGRATION"
          grep -q 'config.json.chaina-backup' "$INTEGRATION"
          grep -q 'Holy.gg' "$INTEGRATION"
          grep -q 'Jugadores conectados' "$INTEGRATION"
          grep -q 'styledplayerlist reload' "$INTEGRATION"
          grep -q 'hideStreamHudWhenTabIntegrated' "$TWITCH"
          grep -q 'styledPlayerListAutoConfigure' "$CONFIG"
          grep -q 'configVersion = 14' "$CONFIG"

      - name: Compile and package alpha.10
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify final JAR
        run: |
          set -euxo pipefail
          JAR=/tmp/chainacobblemon/build/libs/Chainacobblemon-0.4.0-alpha.10+1.21.1.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainacobblemon/twitch/StyledPlayerListIntegration.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainacobblemon/twitch/StreamBonusService.class'
          jar tf "$JAR" | grep -q 'META-INF/jars/placeholder-api'
          unzip -p "$JAR" fabric.mod.json | grep -q '0.4.0-alpha.10+1.21.1'
          unzip -p "$JAR" fabric.mod.json | grep -q 'styledplayerlist'

      - name: Prepare authoritative artifact
        run: |
          set -euxo pipefail
          OUT=/tmp/alpha10-out
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/chainacobblemon/build/libs/Chainacobblemon-0.4.0-alpha.10+1.21.1.jar "$OUT/"
          cd /tmp/chainacobblemon
          zip -qr "$OUT/Chainacobblemon-0.4.0-alpha.10-source.zip" . -x 'build/*' '.gradle/*'
          cat > "$OUT/README-ALPHA10.txt" <<'EOF'
          Chainacobblemon 0.4.0-alpha.10 - Styled Player List automatic integration

          Keep using ChainaBridge 0.4.0-alpha.7. No new Twitch authorization is needed.

          When Styled Player List is installed:
          - Chainacobblemon creates config/styledplayerlist/styles/chaina.json if it does not exist.
          - On the first auto-install it backs up config/styledplayerlist/config.json to config.json.chaina-backup.
          - It selects style `chaina` as default only once and enables TAB in singleplayer.
          - It reloads Styled Player List automatically at server start.
          - Existing unrelated Styled Player List styles are never deleted or overwritten.
          - If the admin later changes default_style manually, Chainacobblemon respects that choice on future starts.

          Dynamic Text Placeholder API placeholders:
          %chainacobblemon:twitch_status%
          %chainacobblemon:stream_bonuses%
          %chainacobblemon:stream_jackpot%
          %chainacobblemon:stream_bonus_1%
          %chainacobblemon:stream_bonus_2%
          %chainacobblemon:stream_bonus_3%
          %chainacobblemon:stream_bonus_4%
          %chainacobblemon:twitch_channel%

          Default TAB design:
          - CHAINA SERVER title
          - EN VIVO / OFFLINE Twitch state
          - DIRECTO LEGENDARIO when applicable
          - Current random stream bonuses
          - Online/max player count
          - Twitch-link reminder
          - `Hosting gracias a Holy.gg`

          When TAB integration is active, the old floating Twitch HUD is hidden by default to avoid duplicate information. If Styled Player List is absent or auto-configuration fails, the floating HUD remains as fallback.
          EOF
          cd "$OUT"
          sha256sum Chainacobblemon-0.4.0-alpha.10+1.21.1.jar Chainacobblemon-0.4.0-alpha.10-source.zip > SHA256SUMS-0.4.0-alpha.10.txt
          ls -lh

      - name: Upload alpha.10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.10-Styled-Player-List
          path: /tmp/alpha10-out/*
          if-no-files-found: error
          retention-days: 90
