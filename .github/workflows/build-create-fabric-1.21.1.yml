name: Build Create Fabric 1.21.1 upstream

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-create-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone upstream Create Fabric 1.21.1
        run: |
          git clone --depth 1 --branch 'mc1.21.1/fabric/dev' https://github.com/Fabricators-of-Create/Create.git upstream-create
          cd upstream-create
          test "$(git rev-parse HEAD)" = "7f1f67b6ecbbde512e8d35404f3621a6875ce838"
          git rev-parse HEAD | tee ../UPSTREAM_COMMIT.txt
          git log -1 --pretty='%H%n%ci%n%s' > ../UPSTREAM_INFO.txt

      - name: Update moved FTB Maven endpoint
        working-directory: upstream-create
        run: |
          set -euxo pipefail
          grep -q 'https://maven.saps.dev/releases' build.gradle.kts
          sed -i 's#https://maven.saps.dev/releases#https://maven.ftb.dev/releases#g' build.gradle.kts
          grep -q 'https://maven.ftb.dev/releases' build.gradle.kts
          grep -q 'dev.ftb.mods:ftb-chunks-fabric:2001.3.1' build.gradle.kts
          grep -q 'dev.ftb.mods:ftb-teams-fabric:2001.3.0' build.gradle.kts
          grep -q 'dev.ftb.mods:ftb-library-fabric:2001.2.4' build.gradle.kts

      - name: Build upstream source
        working-directory: upstream-create
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee ../create-build.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > ../BUILD_EXIT.txt
          exit "$STATUS"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Create-Fabric-1.21.1-build-diagnostics
          path: |
            create-build.log
            BUILD_EXIT.txt
            UPSTREAM_COMMIT.txt
            UPSTREAM_INFO.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Fabric 1.21.1 output
        run: |
          set -euxo pipefail
          ls -lah upstream-create/build/libs
          JAR="$(find upstream-create/build/libs -maxdepth 1 -type f -name 'create-fabric-*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*shadow*' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json > fabric.mod.json
          grep -q '"id"[[:space:]]*:[[:space:]]*"create"' fabric.mod.json
          grep -q '1.21.1' fabric.mod.json
          cp "$JAR" Create-Fabric-1.21.1-DEV-BUILD.jar
          sha256sum Create-Fabric-1.21.1-DEV-BUILD.jar > SHA256SUMS.txt
          {
            echo 'Create Fabric 1.21.1 development build'
            echo
            echo 'Source: Fabricators-of-Create/Create'
            echo 'Upstream branch: mc1.21.1/fabric/dev'
            echo -n 'Upstream commit: '; cat UPSTREAM_COMMIT.txt
            echo
            cat UPSTREAM_INFO.txt
            echo
            echo 'Build-only compatibility fix: the obsolete FTB Maven repository URL was changed from maven.saps.dev/releases to the current maven.ftb.dev/releases endpoint.'
            echo 'All declared FTB compile-only dependencies were retained.'
            echo 'No Create Java/resource source files were modified.'
            echo 'This is a development build, not an official Create release.'
          } > BUILD-INFO.txt

      - name: Upload compiled Create Fabric
        uses: actions/upload-artifact@v4
        with:
          name: Create-Fabric-1.21.1-DEV-BUILD
          path: |
            Create-Fabric-1.21.1-DEV-BUILD.jar
            SHA256SUMS.txt
            BUILD-INFO.txt
            UPSTREAM_COMMIT.txt
            fabric.mod.json
          if-no-files-found: error
          retention-days: 30
