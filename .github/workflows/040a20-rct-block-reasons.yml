name: Build Chainacobblemon 0.4.0-alpha.20 RCT Block Reasons

on:
  push:
    branches:
      - release/0.4.0-alpha.20
    paths:
      - 'ci/040a20/**'
      - '.github/workflows/040a20-rct-block-reasons.yml'
  pull_request:
    branches:
      - release/0.4.0-alpha.19
    paths:
      - 'ci/040a20/**'
      - '.github/workflows/040a20-rct-block-reasons.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.20
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/040a20/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.20-RCT-Block-Reasons
          path: /tmp/alpha20-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.20 to dist
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -rf dist/alpha20
          mkdir -p dist/alpha20
          cp /tmp/alpha20-out/* dist/alpha20/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha20/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha20/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha20
          git commit -m 'build: publish verified alpha20 artifacts'
          git push origin HEAD:release/0.4.0-alpha.20
