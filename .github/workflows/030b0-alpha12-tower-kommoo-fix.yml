name: Build Chainacobblemon 0.3.0-alpha.12 Tower Kommo-o fix

on:
  push:
    branches:
      - release/0.3.0-alpha.12
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.11 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9274622313/zip' \
            -o /tmp/alpha11-artifact.zip
          mkdir -p /tmp/alpha11-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha11-artifact.zip -d /tmp/alpha11-artifact
          srczip="$(find /tmp/alpha11-artifact -name 'Chainacobblemon-0.3.0-alpha.11-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply Kommo-o fix and bump alpha.12
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          target='src/main/java/com/andrewbristowx/chainacobblemon/tower/ChallengeTowerService.java'
          grep -q '"kommo_o"' "$target"
          sed -i 's/"kommo_o"/"kommo-o"/g' "$target"
          grep -q '"kommo-o"' "$target"
          ! grep -q '"kommo_o"' "$target"
          grep -RIl '0.3.0-alpha.11' . --exclude-dir=.gradle --exclude-dir=build | xargs -r sed -i 's/0.3.0-alpha.11/0.3.0-alpha.12/g'

      - name: Compile Chainacobblemon alpha.12
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.12 Tower species fix
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.12*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.12' fabric.mod.json
          javap -classpath "/tmp/chainacobblemon/$jarfile" -c -p com.andrewbristowx.chainacobblemon.tower.ChallengeTowerService > /tmp/tower.javap
          grep -q 'kommo-o' /tmp/tower.javap
          ! grep -q 'kommo_o' /tmp/tower.javap

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.12*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.12+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.12-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.12+1.21.1.jar Chainacobblemon-0.3.0-alpha.12-source.zip > SHA256SUMS-0.3.0-alpha.12.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.12
          path: /tmp/out/*
