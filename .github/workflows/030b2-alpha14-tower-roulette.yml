name: Build Chainacobblemon 0.3.0-alpha.14 Tower roulette

on:
  push:
    branches:
      - release/0.3.0-alpha.14
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.13 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9275800592/zip' \
            -o /tmp/alpha13-artifact.zip
          rm -rf /tmp/alpha13-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha13-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha13-artifact.zip -d /tmp/alpha13-artifact
          srczip="$(find /tmp/alpha13-artifact -name 'Chainacobblemon-0.3.0-alpha.13-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply alpha.14 Tower roulette overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/alpha14/overlay.part1 ci/alpha14/overlay.part2 ci/alpha14/overlay.part3 ci/alpha14/overlay.part4 ci/alpha14/overlay.part5 ci/alpha14/overlay.part6 > /tmp/a14.b64
          base64 -d /tmp/a14.b64 > /tmp/apply_alpha14.py.gz
          gzip -dc /tmp/apply_alpha14.py.gz > /tmp/apply_alpha14.py
          cd /tmp/chainacobblemon
          python3 /tmp/apply_alpha14.py
          grep -q '0.3.0-alpha.14' gradle.properties

      - name: Compile Chainacobblemon alpha.14
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.14 Tower roulette
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.14*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.14' fabric.mod.json
          test -f com/andrewbristowx/chainacobblemon/tower/TowerRouletteNetworking.class
          test -f com/andrewbristowx/chainacobblemon/tower/TowerRouletteSnapshot.class
          test -f com/andrewbristowx/chainacobblemon/client/tower/TowerRouletteScreen.class
          javap -classpath "/tmp/chainacobblemon/$jarfile" -c -p com.andrewbristowx.chainacobblemon.tower.ChallengeTowerService > /tmp/tower14.javap
          javap -classpath "/tmp/chainacobblemon/$jarfile" -c -p com.andrewbristowx.chainacobblemon.tower.ChallengeTowerCommands > /tmp/towercmd14.javap
          javap -classpath "/tmp/chainacobblemon/$jarfile" -c -p com.andrewbristowx.chainacobblemon.client.tower.TowerRouletteScreen > /tmp/roulette14.javap
          grep -q 'JACKPOT' /tmp/tower14.javap
          grep -q 'forceRoulette' /tmp/tower14.javap
          grep -q 'toggleBuildMode' /tmp/tower14.javap
          grep -q 'forceRebuildFloor' /tmp/tower14.javap
          grep -q 'roulette' /tmp/towercmd14.javap
          grep -q 'jackpot' /tmp/towercmd14.javap
          grep -q 'buildmode' /tmp/towercmd14.javap
          grep -q 'lighting' /tmp/towercmd14.javap
          grep -q 'RULETA DE RECOMPENSA' /tmp/roulette14.javap
          strings com/andrewbristowx/chainacobblemon/tower/TowerRouletteNetworking.class | grep -q 'open_tower_roulette'
          grep -q 'kommo-o' /tmp/tower14.javap
          ! grep -q 'kommo_o' /tmp/tower14.javap

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.14*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.14+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.14-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.14+1.21.1.jar Chainacobblemon-0.3.0-alpha.14-source.zip > SHA256SUMS-0.3.0-alpha.14.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.14
          path: /tmp/out/*
