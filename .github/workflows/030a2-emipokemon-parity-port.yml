name: Build Chainacobblemon 0.3.0-alpha.4 layout and dialogue refinements

on:
  push:
    branches:
      - release/0.3.0-alpha.4
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install transformer dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore exact mature Emipokemon 0.5.0-alpha.15 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Emipokemon/actions/artifacts/9257343327/zip' \
            -o /tmp/emipokemon-alpha15-artifact.zip
          mkdir -p /tmp/emipokemon-artifact /tmp/emipokemon-src
          unzip -q /tmp/emipokemon-alpha15-artifact.zip -d /tmp/emipokemon-artifact
          srczip="$(find /tmp/emipokemon-artifact -name 'Emipokemon-0.5.0-alpha.15-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/emipokemon-src
          test -f /tmp/emipokemon-src/src/client/java/com/emipokemon/client/gacha/GachaScreen.java
          grep -q 'RESULT_STAGGER_MS = 135L' /tmp/emipokemon-src/src/client/java/com/emipokemon/client/gacha/GachaScreen.java
          grep -qi 'brock' /tmp/emipokemon-src/src/main/java/com/emipokemon/challenge/ChallengeCatalog.java

      - name: Transform mature systems to Chaina identity
        shell: bash
        run: |
          set -euxo pipefail
          python ci/port_emipokemon_alpha15_to_chaina.py /tmp/emipokemon-src /tmp/chainacobblemon
          python ci/post_transform_cleanup.py /tmp/chainacobblemon
          python ci/chaina_gui_palette.py /tmp/chainacobblemon
          python ci/spanish_ui_cleanup.py /tmp/chainacobblemon
          python - <<'PY'
          import base64,lzma
          payload=open('ci/alpha3_ui_fixes.py.xz.b64','rb').read()
          open('/tmp/alpha3_ui_fixes.py','wb').write(lzma.decompress(base64.b64decode(payload)))
          PY
          python /tmp/alpha3_ui_fixes.py /tmp/chainacobblemon
          python ci/alpha4_layout_dialogue_fixes.py /tmp/chainacobblemon
          test -f /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/challenge/ChallengeCatalog.java
          test -f /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/npc/NpcEditorScreen.java
          grep -q 'RESULT_STAGGER_MS = 135L' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/gacha/GachaScreen.java
          grep -q 'RESULT_POP_MS = 190L' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/gacha/GachaScreen.java
          grep -q 'GASHA ESTÁNDAR DE CHAINA' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/gacha/GachaScreen.java
          grep -q 'panelHeight = Math.min(210' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/npc/NpcDialogueScreen.java
          grep -q '0xFF2D2E33' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/npc/NpcDialogueScreen.java
          grep -q 'RECOMPENSA DIARIA", 748, 58' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/rewards/DailyRewardScreen.java
          grep -q 'PASE INFINITO DE CHAINA", 760, 54' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/rewards/BattlePassScreen.java
          grep -q 'textures/trainers/single/' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/render/RctTrainerTextureResolver.java
          grep -q 'String price = product.price + " ChaiBells"' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/shop/ShopProductButton.java
          grep -q 'drawBell(context' /tmp/chainacobblemon/src/client/java/com/andrewbristowx/chainacobblemon/client/progress/QuestBookButton.java
          ! grep -R -nEi ' Michi|Michicoin' /tmp/chainacobblemon/src/main/java /tmp/chainacobblemon/src/client/java
          ! grep -R -nE '^(package|import) com\.chainacobblemon' /tmp/chainacobblemon/src
          ! find /tmp/chainacobblemon -type f | grep -Ei '/casino/|casino_|claw_machine|poker_table|blackjack_table|pokemon_wager'
          ! grep -R -nEi 'eevee_gatito|snorlax_chaina|espurr_chaina|sprigatito_chaina|zorua_chaina|unown_67' /tmp/chainacobblemon/src/main/java /tmp/chainacobblemon/src/client/java

      - name: Compile alpha.4 Chaina candidate
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Verify identity, version and protected behavior
        shell: bash
        run: |
          set -euxo pipefail
          src=/tmp/chainacobblemon
          jar="$(find "$src/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '"id": "chainacobblemon"'
          unzip -p "$jar" fabric.mod.json | grep -q '0.3.0-alpha.4+1.21.1'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/challenge/ChallengeCatalog.class'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/client/npc/NpcDialogueScreen.class'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/client/gacha/GachaScreen.class'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/client/render/RctTrainerTextureResolver.class'
          if unzip -l "$jar" | grep -Eqi 'casino|michicoin|emipokemon|emi_'; then
            echo 'Forbidden previous-project identity/casino path remains in jar' >&2
            exit 1
          fi
          mkdir -p /tmp/release
          cp "$jar" '/tmp/release/Chainacobblemon-0.3.0-alpha.4+1.21.1.jar'
          (cd "$src" && zip -qr '/tmp/release/Chainacobblemon-0.3.0-alpha.4-source.zip' . -x '.gradle/*' 'build/*')
          sha256sum /tmp/release/Chainacobblemon-0.3.0-alpha.4+1.21.1.jar /tmp/release/Chainacobblemon-0.3.0-alpha.4-source.zip > /tmp/release/SHA256SUMS-0.3.0-alpha.4.txt
          cat /tmp/release/SHA256SUMS-0.3.0-alpha.4.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.4-layout-dialogue-fixes
          path: /tmp/release/*
