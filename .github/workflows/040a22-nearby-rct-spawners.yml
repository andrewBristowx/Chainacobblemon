name: Build Chainacobblemon 0.4.0-alpha.22 Nearby RCT Spawners

on:
  push:
    branches:
      - release/0.4.0-alpha.22
    paths:
      - 'ci/040a22/**'
      - '.github/workflows/040a22-nearby-rct-spawners.yml'
  pull_request:
    branches:
      - release/0.4.0-alpha.21
    paths:
      - 'ci/040a22/**'
      - '.github/workflows/040a22-nearby-rct-spawners.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.22
        run: bash ci/040a22/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.22-Nearby-RCT-Spawners
          path: /tmp/alpha22-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.22 to dist
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -rf dist/alpha22
          mkdir -p dist/alpha22
          cp /tmp/alpha22-out/* dist/alpha22/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha22/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha22/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha22
          git commit -m 'build: publish verified alpha22 artifacts'
          git push origin HEAD:release/0.4.0-alpha.22
