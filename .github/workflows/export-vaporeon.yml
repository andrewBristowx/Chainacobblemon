name: Export Vaporeon assets

on:
  push:
    branches:
      - tools/vaporeon-export
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official Cobblemon Vaporeon working assets
        shell: bash
        run: |
          set -euxo pipefail
          url='https://gitlab.com/api/v4/projects/31589656/repository/archive.zip?sha=master&path=blockbench/pokemon/gen1/0134_vaporeon'
          curl -fL --retry 4 --retry-delay 2 "$url" -o /tmp/vaporeon-source.zip
          mkdir -p /tmp/unpack /tmp/out
          unzip -q /tmp/vaporeon-source.zip -d /tmp/unpack
          src="$(find /tmp/unpack -type d -path '*/blockbench/pokemon/gen1/0134_vaporeon' -print -quit)"
          test -n "$src"
          cp -a "$src" /tmp/out/0134_vaporeon
          cat > /tmp/out/README.txt <<'EOF'
Official editable Vaporeon working assets from Cable / Cobblemon Assets.
Source folder: blockbench/pokemon/gen1/0134_vaporeon
Open the included Blockbench project/model files to edit Vaporeon.
EOF
          cd /tmp/out
          zip -qr /tmp/Vaporeon-Cobblemon-Editable.zip .
          unzip -l /tmp/Vaporeon-Cobblemon-Editable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Vaporeon-Cobblemon-Editable
          path: /tmp/Vaporeon-Cobblemon-Editable.zip
