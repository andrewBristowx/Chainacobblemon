name: Export Vaporeon assets

on:
  push:
    branches:
      - tools/vaporeon-export
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.11 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9274622313/zip' \
            -o /tmp/alpha11-artifact.zip
          mkdir -p /tmp/alpha11-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha11-artifact.zip -d /tmp/alpha11-artifact
          srczip="$(find /tmp/alpha11-artifact -name 'Chainacobblemon-0.3.0-alpha.11-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Resolve Cobblemon dependency
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew compileJava -x test --no-daemon >/tmp/gradle.log 2>&1 || { tail -200 /tmp/gradle.log; exit 1; }

      - name: Extract Vaporeon model, animations and textures
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/vaporeon
          found=''
          while IFS= read -r jar; do
            if unzip -l "$jar" 2>/dev/null | grep -q 'assets/cobblemon/bedrock/pokemon/models/0134_vaporeon'; then
              found="$jar"
              break
            fi
          done < <(find "$HOME/.gradle" /tmp/chainacobblemon -type f -name '*.jar' 2>/dev/null)
          test -n "$found"
          echo "Using Cobblemon jar: $found"
          cd /tmp/vaporeon
          unzip -q "$found" \
            'assets/cobblemon/bedrock/pokemon/models/0134_vaporeon/*' \
            'assets/cobblemon/bedrock/pokemon/animations/0134_vaporeon/*' \
            'assets/cobblemon/bedrock/pokemon/posers/0134_vaporeon/*' \
            'assets/cobblemon/bedrock/pokemon/resolvers/0134_vaporeon/*' \
            'assets/cobblemon/textures/pokemon/0134_vaporeon/*' || true
          test -n "$(find . -type f -name '*.geo.json' -print -quit)"
          cat > README.txt <<'EOF'
Vaporeon assets extracted from the same Cobblemon dependency used by Chainacobblemon alpha.11.

For editing the geometry in Blockbench, import/open the .geo.json file under:
assets/cobblemon/bedrock/pokemon/models/0134_vaporeon/

The package also includes the matching textures, animations, poser and resolver files when present in the Cobblemon jar.
EOF
          zip -qr /tmp/Vaporeon-Cobblemon-1.7.3-editable.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Vaporeon-Cobblemon-1.7.3-editable
          path: /tmp/Vaporeon-Cobblemon-1.7.3-editable.zip
