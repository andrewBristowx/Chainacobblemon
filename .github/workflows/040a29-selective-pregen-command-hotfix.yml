name: Build Chainacobblemon 0.4.0-alpha.29 Selective Pregen Command Hotfix

on:
  push:
    branches:
      - release/0.4.0-alpha.29
    paths:
      - 'ci/040a29/**'
      - '.github/workflows/040a29-selective-pregen-command-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.29
        run: bash ci/040a29/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.29-Selective-Pregen-Command-Hotfix
          path: /tmp/alpha29-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.29 to dist
        run: |
          set -euxo pipefail
          rm -rf dist/alpha29
          mkdir -p dist/alpha29
          cp /tmp/alpha29-out/* dist/alpha29/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha29/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha29/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha29
          git commit -m 'build: publish verified alpha29 artifacts'
          git push origin HEAD:release/0.4.0-alpha.29
