name: Build Chainacobblemon 0.3.0-alpha.16 Event Hotfix

on:
  push:
    branches:
      - release/0.3.0-alpha.16
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.15 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9282115005/zip' \
            -o /tmp/alpha15-artifact.zip
          rm -rf /tmp/alpha15-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha15-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha15-artifact.zip -d /tmp/alpha15-artifact
          srczip="$(find /tmp/alpha15-artifact -name 'Chainacobblemon-0.3.0-alpha.15-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply alpha.16 event hotfix
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/alpha16/apply.py
          grep -q '0.3.0-alpha.16' /tmp/chainacobblemon/gradle.properties
          grep -q 'trainerPos(ServerWorld world, int index)' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java
          grep -q 'shouldProtect' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java
          ! grep -R -q 'Uncached trainer position outside live-world context' /tmp/chainacobblemon/src/main/java

      - name: Compile Chainacobblemon alpha.16
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.16 hotfix
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.16*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.16' fabric.mod.json
          test -f com/andrewbristowx/chainacobblemon/events/ChainaEventManager.class
          test -f com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.class
          strings com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.class | grep -q 'shouldProtect'
          ! strings com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.class | grep -q 'Uncached trainer position outside live-world context'
          grep -q 'TreasureHuntService.cleanup(server, true)' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.16*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.16+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.16-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.16+1.21.1.jar Chainacobblemon-0.3.0-alpha.16-source.zip > SHA256SUMS-0.3.0-alpha.16.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.16
          path: /tmp/out/*
