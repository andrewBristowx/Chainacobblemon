name: Build Chainacobblemon 0.4.0-alpha.5 Persistent Twitch Sessions

on:
  push:
    branches:
      - release/0.4.0-alpha.5
    paths-ignore:
      - 'dist/040a5/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.31 source and Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/chainacobblemon
          mkdir -p /tmp/chainacobblemon
          test -f dist/alpha31/Chainacobblemon-0.3.0-alpha.31-source.zip
          unzip -q dist/alpha31/Chainacobblemon-0.3.0-alpha.31-source.zip -d /tmp/chainacobblemon
          grep -q 'mod_version=0.3.0-alpha.31+1.21.1' /tmp/chainacobblemon/gradle.properties
          sed -i 's/\r$//' /tmp/chainacobblemon/gradlew
          chmod +x /tmp/chainacobblemon/gradlew

      - name: Prepare and patch ChainaBridge alpha.5
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/bridge-alpha5
          cp -a bridge /tmp/bridge-alpha5
          python ci/040a5/bridge_hotfix.py
          python ci/040a5/selftest_patch.py
          grep -q '0.4.0-alpha.5' /tmp/bridge-alpha5/build.gradle
          grep -q 'AES/GCM/NoPadding' /tmp/bridge-alpha5/src/main/java/com/andrewbristowx/chainabridge/ChainaBridgeMain.java
          grep -q 'CHAINABRIDGE_MASTER_KEY' /tmp/bridge-alpha5/src/main/java/com/andrewbristowx/chainabridge/ChainaBridgeMain.java

      - name: Build standalone ChainaBridge alpha.5
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/chainacobblemon/gradlew -p /tmp/bridge-alpha5 clean jar --no-daemon 2>&1 | tee /tmp/chainabridge-alpha5-build.log
          test -f /tmp/bridge-alpha5/build/libs/ChainaBridge-0.4.0-alpha.5.jar

      - name: Test encrypted authorization persistence
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/bridge-store-test
          mkdir -p /tmp/bridge-store-test
          cp /tmp/bridge-alpha5/build/libs/ChainaBridge-0.4.0-alpha.5.jar /tmp/bridge-store-test/
          cd /tmp/bridge-store-test
          java -jar ChainaBridge-0.4.0-alpha.5.jar --self-test-store 2>&1 | tee selftest.log
          grep -q 'CHAINABRIDGE_ENCRYPTED_STORE_SELF_TEST_OK' selftest.log
          test -s chainabridge-master.key
          test -s chainabridge-accounts.enc
          ! grep -q 'ACCESS_TOKEN_MUST_NOT_APPEAR_PLAINTEXT' chainabridge-accounts.enc
          ! grep -q 'REFRESH_TOKEN_MUST_NOT_APPEAR_PLAINTEXT' chainabridge-accounts.enc

      - name: Smoke test ChainaBridge HTTP server
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/bridge-http-test
          mkdir -p /tmp/bridge-http-test
          cp /tmp/bridge-alpha5/build/libs/ChainaBridge-0.4.0-alpha.5.jar /tmp/bridge-http-test/
          cd /tmp/bridge-http-test
          java -jar ChainaBridge-0.4.0-alpha.5.jar >bridge.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >health.json; then break; fi
            sleep 0.5
          done
          test -s health.json
          python - <<'PY'
          import base64, json
          e=json.load(open('health.json',encoding='utf-8'))
          p=e['payload'] + '=' * (-len(e['payload']) % 4)
          j=json.loads(base64.urlsafe_b64decode(p).decode())
          assert j['ok'] is True
          assert j['version']=='0.4.0-alpha.5'
          assert j['token_storage']=='aes_256_gcm_disk'
          PY
          curl -fsS http://127.0.0.1:8765/setup >setup.html
          grep -q 'AES-256-GCM' setup.html
          grep -q 'No necesita Client Secret' setup.html
          kill $pid
          wait $pid || true
          trap - EXIT

      - name: Rebuild Chainacobblemon alpha.4 baseline
        shell: bash
        run: |
          set -euxo pipefail
          python ci/040a1/hotfix.py
          python ci/040a2/hotfix.py
          python ci/040a3/hotfix.py
          python ci/040a4/hotfix.py
          grep -q 'mod_version=0.4.0-alpha.4+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Apply Chainacobblemon alpha.5 bump
        shell: bash
        run: |
          set -euxo pipefail
          python ci/040a5/mod_hotfix.py
          grep -q 'mod_version=0.4.0-alpha.5+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Compile and package alpha.5
        id: compile
        shell: bash
        run: |
          set +e
          cd /tmp/chainacobblemon
          ./gradlew clean build -x test --no-daemon 2>&1 | tee /tmp/040a5-build.log
          rc=${PIPESTATUS[0]}

          rm -rf /tmp/publish /tmp/bridge-pack
          mkdir -p /tmp/publish /tmp/bridge-pack
          echo '${{ github.run_id }}' > /tmp/publish/RUN_ID.txt
          cp /tmp/040a5-build.log /tmp/publish/BUILD_LOG.txt
          cp /tmp/chainabridge-alpha5-build.log /tmp/publish/CHAINABRIDGE_BUILD_LOG.txt
          cp /tmp/bridge-alpha5/build/libs/ChainaBridge-0.4.0-alpha.5.jar /tmp/publish/
          cp bridge/README.md /tmp/publish/CHAINABRIDGE-README.md

          if [ "$rc" -eq 0 ]; then
            jarfile="$(find build/libs -maxdepth 1 -type f -name '*0.4.0-alpha.5*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
            if [ -z "$jarfile" ]; then
              echo 'FAILURE: remapped alpha.5 jar was not found.' > /tmp/publish/BUILD_STATUS.txt
              rc=88
            else
              cp "$jarfile" /tmp/publish/Chainacobblemon-0.4.0-alpha.5+1.21.1.jar
              zip -qr /tmp/publish/Chainacobblemon-0.4.0-alpha.5-source.zip . -x './.gradle/*' './build/*'
              cd /tmp
              zip -qr /tmp/publish/ChainaBridge-0.4.0-alpha.5-source.zip bridge-alpha5 -x 'bridge-alpha5/.gradle/*' 'bridge-alpha5/build/*'

              cp /tmp/publish/ChainaBridge-0.4.0-alpha.5.jar /tmp/bridge-pack/
              cp "$GITHUB_WORKSPACE/bridge/README.md" /tmp/bridge-pack/README.md
              cp "$GITHUB_WORKSPACE/bridge/INICIAR-CHAINABRIDGE.bat" /tmp/bridge-pack/
              cd /tmp/bridge-pack
              zip -qr /tmp/publish/ChainaBridge-0.4.0-alpha.5-PACK.zip .

              cd /tmp/publish
              sha256sum Chainacobblemon-0.4.0-alpha.5+1.21.1.jar ChainaBridge-0.4.0-alpha.5.jar ChainaBridge-0.4.0-alpha.5-PACK.zip Chainacobblemon-0.4.0-alpha.5-source.zip ChainaBridge-0.4.0-alpha.5-source.zip > SHA256SUMS-0.4.0-alpha.5.txt
              echo 'SUCCESS' > BUILD_STATUS.txt
            fi
          else
            echo "FAILURE rc=$rc" > /tmp/publish/BUILD_STATUS.txt
          fi
          echo "$rc" > /tmp/publish/BUILD_RC.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify alpha.5 jars
        if: steps.compile.outputs.rc == '0'
        shell: bash
        run: |
          set -euxo pipefail
          mod=/tmp/publish/Chainacobblemon-0.4.0-alpha.5+1.21.1.jar
          bridge=/tmp/publish/ChainaBridge-0.4.0-alpha.5.jar
          test -f "$mod" && test -f "$bridge"
          rm -rf /tmp/modcheck && mkdir -p /tmp/modcheck
          cd /tmp/modcheck
          jar xf "$mod"
          grep -q '0.4.0-alpha.5' fabric.mod.json
          test -f com/andrewbristowx/chainacobblemon/twitch/TwitchBridgeClient.class
          cd /tmp
          jar tf "$bridge" | grep -q 'com/andrewbristowx/chainabridge/ChainaBridgeMain.class'
          unzip -p "$bridge" META-INF/MANIFEST.MF | grep -q 'Main-Class: com.andrewbristowx.chainabridge.ChainaBridgeMain'

      - name: Upload authoritative alpha.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.5-persistent-Twitch
          path: /tmp/publish/*

      - name: Publish build result to branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist/040a5
          mkdir -p dist/040a5
          cp -a /tmp/publish/. dist/040a5/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/040a5
          git commit -m 'ci: publish 0.4.0-alpha.5 persistent Twitch build [skip ci]' || true
          git push origin HEAD:release/0.4.0-alpha.5

      - name: Fail workflow if compile failed
        shell: bash
        run: |
          rc="$(cat /tmp/publish/BUILD_RC.txt)"
          test "$rc" -eq 0
