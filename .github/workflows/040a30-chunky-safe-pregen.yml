name: Build Chainacobblemon 0.4.0-alpha.30 Chunky Safe Pregen

on:
  push:
    branches:
      - release/0.4.0-alpha.30
    paths:
      - 'ci/040a30/**'
      - '.github/workflows/040a30-chunky-safe-pregen.yml'
  pull_request:
    branches:
      - release/0.4.0-alpha.28
    paths:
      - 'ci/040a30/**'
      - '.github/workflows/040a30-chunky-safe-pregen.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.30
        run: bash ci/040a30/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.30-Chunky-Safe-Pregen
          path: /tmp/alpha30-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.30 to dist
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -rf dist/alpha30
          mkdir -p dist/alpha30
          cp /tmp/alpha30-out/* dist/alpha30/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha30/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha30/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha30
          git commit -m 'build: publish verified alpha30 artifacts'
          git push origin HEAD:release/0.4.0-alpha.30
