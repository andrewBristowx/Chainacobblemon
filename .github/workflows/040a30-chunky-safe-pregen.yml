name: Build Chainacobblemon 0.4.0-alpha.31 Watchdog Safe Pregen

on:
  pull_request:
    branches:
      - ci/alpha31-base
    paths:
      - 'ci/040a31/**'
      - '.github/workflows/040a30-chunky-safe-pregen.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.31
        run: bash ci/040a31/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.31-Watchdog-Safe-Pregen
          path: /tmp/alpha31-out/*
          if-no-files-found: error
          retention-days: 90
