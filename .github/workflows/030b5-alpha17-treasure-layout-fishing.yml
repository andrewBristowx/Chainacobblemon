name: Build Chainacobblemon 0.3.0-alpha.17 Treasure Layout Fishing

on:
  push:
    branches:
      - release/0.3.0-alpha.17
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.16 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9289141537/zip' \
            -o /tmp/alpha16-artifact.zip
          rm -rf /tmp/alpha16-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha16-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha16-artifact.zip -d /tmp/alpha16-artifact
          srczip="$(find /tmp/alpha16-artifact -name 'Chainacobblemon-0.3.0-alpha.16-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply exact alpha.17 overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/alpha17/part00 ci/alpha17/part01 ci/alpha17/part02 ci/alpha17/part03 ci/alpha17/part04 ci/alpha17/part05 > /tmp/alpha17-overlay.b64
          base64 -d /tmp/alpha17-overlay.b64 > /tmp/alpha17-overlay.tar.gz
          echo 'fc6777953aac7d097880b31480a4ddc017e8c1af626d0010eb5389e42624978b  /tmp/alpha17-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/alpha17-overlay.tar.gz -C /tmp/chainacobblemon
          grep -q 'mod_version=0.3.0-alpha.17+1.21.1' /tmp/chainacobblemon/gradle.properties
          grep -q 'detectLayout' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java
          grep -q 'FISHING_ENCOUNTERS' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java
          ! grep -q 'FISHED_POKEMON' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java

      - name: Compile Chainacobblemon alpha.17
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.17 fixes
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.17*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.17' fabric.mod.json
          test -f com/andrewbristowx/chainacobblemon/events/ChainaEventManager.class
          test -f com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.class
          test -f com/andrewbristowx/chainacobblemon/dungeon/DungeonTrainerService.class
          test -f com/andrewbristowx/chainacobblemon/npc/NpcBattleService.class
          javap -classpath "/tmp/chainacobblemon/$jarfile" -p com.andrewbristowx.chainacobblemon.events.treasure.TreasureHuntService > /tmp/treasure17.javap
          grep -q 'detectLayout' /tmp/treasure17.javap
          grep -q 'debugSummary' /tmp/treasure17.javap
          grep -q 'cleanupTrainerPokemon' /tmp/treasure17.javap
          grep -q 'event.getPokemon()' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java
          grep -q 'event.getPlayer()' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java
          grep -q 'averageTopThree' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/dungeon/DungeonTrainerService.java
          grep -q 'treasure debug' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/EventCommands.java || true

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.17*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.17+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.17-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.17+1.21.1.jar Chainacobblemon-0.3.0-alpha.17-source.zip > SHA256SUMS-0.3.0-alpha.17.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.17
          path: /tmp/out/*
