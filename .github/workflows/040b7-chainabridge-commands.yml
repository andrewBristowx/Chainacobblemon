name: Build ChainaBridge 0.4.0-alpha.7 Configurable Bot Commands

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore authoritative ChainaBridge alpha.5 source
        run: |
          set -euxo pipefail
          test -f dist/040a5/ChainaBridge-0.4.0-alpha.5-source.zip
          rm -rf /tmp/bridge-unzip /tmp/chainabridge
          mkdir -p /tmp/bridge-unzip
          unzip -q dist/040a5/ChainaBridge-0.4.0-alpha.5-source.zip -d /tmp/bridge-unzip
          if [ -d /tmp/bridge-unzip/bridge-alpha5 ]; then
            mv /tmp/bridge-unzip/bridge-alpha5 /tmp/chainabridge
          else
            mkdir -p /tmp/chainabridge
            cp -a /tmp/bridge-unzip/. /tmp/chainabridge/
          fi
          test -f /tmp/chainabridge/src/main/java/com/andrewbristowx/chainabridge/ChainaBridgeMain.java
          grep -q "version = '0.4.0-alpha.5'" /tmp/chainabridge/build.gradle

      - name: Restore validated ChainaBridge alpha.6 EventSub
        run: |
          set -euxo pipefail
          cd /tmp/chainabridge
          patch -p1 < "$GITHUB_WORKSPACE/ci/040b6/bridge_alpha6_support.patch"
          cat \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part0" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part1" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part2" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part3" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part4" \
            "$GITHUB_WORKSPACE/ci/040b6/BotEventSubService.part5" \
            > src/main/java/com/andrewbristowx/chainabridge/BotEventSubService.java
          grep -q "version = '0.4.0-alpha.6'" build.gradle

      - name: Apply ChainaBridge alpha.7 configurable commands
        run: |
          set -euxo pipefail
          cd /tmp/chainabridge
          cat \
            "$GITHUB_WORKSPACE/ci/040b7/bridge_alpha7_existing.part0" \
            "$GITHUB_WORKSPACE/ci/040b7/bridge_alpha7_existing.part1" \
            "$GITHUB_WORKSPACE/ci/040b7/bridge_alpha7_existing.part2" \
            "$GITHUB_WORKSPACE/ci/040b7/bridge_alpha7_existing.part3" \
            "$GITHUB_WORKSPACE/ci/040b7/bridge_alpha7_existing.part4" \
            > /tmp/bridge-alpha7.patch
          patch -p1 < /tmp/bridge-alpha7.patch
          cat \
            "$GITHUB_WORKSPACE/ci/040b7/BotCommandManager.part0" \
            "$GITHUB_WORKSPACE/ci/040b7/BotCommandManager.part1" \
            "$GITHUB_WORKSPACE/ci/040b7/BotCommandManager.part2" \
            "$GITHUB_WORKSPACE/ci/040b7/BotCommandManager.part3" \
            "$GITHUB_WORKSPACE/ci/040b7/BotCommandManager.part4" \
            "$GITHUB_WORKSPACE/ci/040b7/BotCommandManager.part5" \
            "$GITHUB_WORKSPACE/ci/040b7/BotCommandManager.part6" \
            > src/main/java/com/andrewbristowx/chainabridge/BotCommandManager.java
          patch -p1 < "$GITHUB_WORKSPACE/ci/040b7/bridge_alpha7_followup.patch"

      - name: Verify alpha.7 source contract
        run: |
          set -euxo pipefail
          cd /tmp/chainabridge
          MAIN=src/main/java/com/andrewbristowx/chainabridge/ChainaBridgeMain.java
          BOT=src/main/java/com/andrewbristowx/chainabridge/BotEventSubService.java
          CMD=src/main/java/com/andrewbristowx/chainabridge/BotCommandManager.java
          grep -q "version = '0.4.0-alpha.7'" build.gradle
          grep -q '0.4.0-alpha.7' "$MAIN"
          grep -q 'user:read:chat' "$BOT"
          grep -q 'user:write:chat' "$BOT"
          grep -q 'user:bot' "$BOT"
          grep -q 'https://api.twitch.tv/helix/chat/messages' "$BOT"
          grep -q 'channel.chat.message' "$BOT"
          grep -q 'channel.chat.notification' "$BOT"
          grep -q 'Actualizar permisos para escribir' "$BOT"
          grep -q 'closeSocket();' "$BOT"
          grep -q 'chainabridge-commands.json' "$CMD"
          grep -q 'chainabridge-automessages.json' "$CMD"
          grep -q 'new CommandDef("!server"' "$CMD"
          grep -q 'new CommandDef("!vincular"' "$CMD"
          grep -q 'new CommandDef("!beneficios"' "$CMD"
          grep -q 'recordatorio_vincular' "$CMD"
          grep -q 'onlyWhenLive' "$CMD"
          grep -q 'reloadIfChangedSafely' "$CMD"
          grep -q '"subs"' "$CMD"
          grep -q '"mods"' "$CMD"
          grep -q '{user}' "$CMD"
          grep -q '{channel}' "$CMD"
          grep -q 'Chaina OAuth token: NOT USED' "$MAIN"
          ! grep -qi 'client_secret' "$BOT"

      - name: Install Gradle 9.6.1
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.1-bin.zip -o /tmp/gradle-9.6.1-bin.zip
          unzip -q /tmp/gradle-9.6.1-bin.zip -d /tmp
          /tmp/gradle-9.6.1/bin/gradle --version

      - name: Compile ChainaBridge alpha.7
        run: |
          set -euxo pipefail
          cd /tmp/chainabridge
          /tmp/gradle-9.6.1/bin/gradle clean jar --no-daemon
          JAR=build/libs/ChainaBridge-0.4.0-alpha.7.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainabridge/ChainaBridgeMain.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainabridge/BotEventSubService.class'
          jar tf "$JAR" | grep -q 'com/andrewbristowx/chainabridge/BotCommandManager.class'

      - name: Test encrypted player authorization persistence
        run: |
          set -euxo pipefail
          JAR=/tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.7.jar
          rm -rf /tmp/test-player-store
          mkdir -p /tmp/test-player-store
          cd /tmp/test-player-store
          java -jar "$JAR" --self-test-store | tee output.txt
          grep -q 'CHAINABRIDGE_ENCRYPTED_STORE_SELF_TEST_OK' output.txt
          test -s chainabridge-accounts.enc
          ! grep -q 'TOKEN-MUST-NOT-APPEAR' chainabridge-accounts.enc

      - name: Test encrypted bot authorization persistence
        run: |
          set -euxo pipefail
          JAR=/tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.7.jar
          rm -rf /tmp/test-bot-store
          mkdir -p /tmp/test-bot-store
          cd /tmp/test-bot-store
          java -jar "$JAR" --self-test-bot-store | tee output.txt
          grep -q 'CHAINABRIDGE_ENCRYPTED_BOT_STORE_SELF_TEST_OK' output.txt
          test -s chainabridge-bot.enc
          ! grep -q 'BOT_ACCESS_TOKEN_MUST_NOT_APPEAR_PLAINTEXT' chainabridge-bot.enc
          ! grep -q 'BOT_REFRESH_TOKEN_MUST_NOT_APPEAR_PLAINTEXT' chainabridge-bot.enc

      - name: Test configurable commands and hot reload
        run: |
          set -euxo pipefail
          JAR=/tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.7.jar
          rm -rf /tmp/test-http
          mkdir -p /tmp/test-http
          cd /tmp/test-http
          java -jar "$JAR" > bridge.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/bot/commands > commands.html; then break; fi
            sleep 1
          done
          grep -q '!server' commands.html
          grep -q '!vincular' commands.html
          grep -q '!beneficios' commands.html
          test -s chainabridge-commands.json
          test -s chainabridge-automessages.json
          grep -q 'recordatorio_vincular' chainabridge-automessages.json
          curl -fsS -o /dev/null -X POST \
            -d 'original=&command=%21reglas&aliases=%21rules&cooldown=15&access=everyone&enabled=on&response=Reglas+del+servidor' \
            http://127.0.0.1:8765/bot/commands/save
          grep -q '"!reglas"' chainabridge-commands.json
          python - <<'PY'
          import json
          p='chainabridge-commands.json'
          d=json.load(open(p,encoding='utf-8'))
          d['commands'].append({'command':'!archivo','aliases':[],'enabled':True,'response':'recargado','cooldown_seconds':1,'access':'everyone'})
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          sleep 6
          curl -fsS http://127.0.0.1:8765/bot/commands > reloaded.html
          grep -q '!archivo' reloaded.html
          kill $PID
          wait $PID || true
          trap - EXIT

      - name: Prepare release package
        run: |
          set -euxo pipefail
          OUT=/tmp/chainabridge-alpha7-out
          rm -rf "$OUT" /tmp/chainabridge-pack
          mkdir -p "$OUT" /tmp/chainabridge-pack
          cp /tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.7.jar "$OUT/"
          cp /tmp/chainabridge/build/libs/ChainaBridge-0.4.0-alpha.7.jar /tmp/chainabridge-pack/
          cp /tmp/chainabridge/INICIAR-CHAINABRIDGE.bat /tmp/chainabridge-pack/
          cp /tmp/chainabridge/README.md /tmp/chainabridge-pack/
          cd /tmp/chainabridge-pack
          zip -qr "$OUT/ChainaBridge-0.4.0-alpha.7-PACK.zip" .
          cd /tmp/chainabridge
          zip -qr "$OUT/ChainaBridge-0.4.0-alpha.7-source.zip" . -x 'build/*' '.gradle/*'
          cat > "$OUT/README-ALPHA7.txt" <<'TXT'
          ChainaBridge 0.4.0-alpha.7 - configurable ChainaMinecraftBot commands

          KEEP your existing local files from alpha.6:
          chainabridge.properties
          chainabridge-keys.json
          chainabridge-master.key
          chainabridge-accounts.enc
          chainabridge-bot.enc

          IMPORTANT: alpha.7 adds user:write:chat. Your existing alpha.6 bot authorization cannot write.
          Start alpha.7, open http://127.0.0.1:8765/bot and press "Actualizar permisos para escribir" once.
          Authorize ONLY ChainaMinecraftBot.

          Default commands:
          !server / !servidor / !minecraft
          !vincular / !link
          !beneficios / !beneficiossub / !subbeneficios

          Command editor:
          http://127.0.0.1:8765/bot/commands

          Files created automatically:
          chainabridge-commands.json
          chainabridge-automessages.json

          They hot-reload without rebuilding or restarting.
          Default automatic reminder: every 30 minutes, only while chainavt is live and only if chat was active in the previous 10 minutes.

          Chaina OAuth token: NOT USED.
          Client Secret: NOT USED.
          TXT
          cd "$OUT"
          sha256sum ChainaBridge-0.4.0-alpha.7.jar ChainaBridge-0.4.0-alpha.7-PACK.zip ChainaBridge-0.4.0-alpha.7-source.zip > SHA256SUMS-0.4.0-alpha.7.txt
          ls -lh

      - name: Upload ChainaBridge alpha.7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainaBridge-0.4.0-alpha.7-Configurable-Bot-Commands
          path: /tmp/chainabridge-alpha7-out/*
          if-no-files-found: error
          retention-days: 90
