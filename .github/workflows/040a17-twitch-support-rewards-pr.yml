name: Verify Chainacobblemon 0.4.0-alpha.17 Twitch Support Rewards

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  verify-chainacobblemon-alpha17:
    if: github.head_ref == 'release/0.4.0-alpha.17'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify alpha.17
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/040a17/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.17-Twitch-Support-Rewards
          path: /tmp/alpha17-out/*
          if-no-files-found: error
          retention-days: 90
