name: Build Chainacobblemon 0.3.0-alpha.18 Treasure Maze Fishing

on:
  push:
    branches:
      - release/0.3.0-alpha.18
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.17 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9293600753/zip' \
            -o /tmp/alpha17-artifact.zip
          rm -rf /tmp/alpha17-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha17-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha17-artifact.zip -d /tmp/alpha17-artifact
          srczip="$(find /tmp/alpha17-artifact -name 'Chainacobblemon-0.3.0-alpha.17-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply exact alpha.18 overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/alpha18/part00 ci/alpha18/part01 ci/alpha18/part02 ci/alpha18/part03 ci/alpha18/part04 ci/alpha18/part05 > /tmp/alpha18-overlay.b64
          base64 -d /tmp/alpha18-overlay.b64 > /tmp/alpha18-overlay.tar.gz
          echo 'e66bc3e3a4017eaaade372e0951ba7d0c04a86f247dc0a77290ad425fb04019f  /tmp/alpha18-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/alpha18-overlay.tar.gz -C /tmp/chainacobblemon
          grep -q 'mod_version=0.3.0-alpha.18+1.21.1' /tmp/chainacobblemon/gradle.properties
          grep -q 'treasure_maze' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java
          grep -q 'POKEROD_REEL' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java
          test -f /tmp/chainacobblemon/src/main/resources/data/chainacobblemon/dimension/treasure_maze.json

      - name: Compile Chainacobblemon alpha.18
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.18 maze and fishing fixes
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.18*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.18' fabric.mod.json
          test -f com/andrewbristowx/chainacobblemon/events/ChainaEventManager.class
          test -f com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.class
          test -f com/andrewbristowx/chainacobblemon/dungeon/DungeonTrainerService.class
          test -f data/chainacobblemon/dimension/treasure_maze.json
          javap -classpath "/tmp/chainacobblemon/$jarfile" -p com.andrewbristowx.chainacobblemon.events.treasure.TreasureHuntService > /tmp/treasure18.javap
          grep -q 'forceNextTier' /tmp/treasure18.javap
          grep -q 'levelOffsetFor' /tmp/treasure18.javap
          grep -q 'cleanupTrainerPokemon' /tmp/treasure18.javap
          grep -q 'playerJoined' /tmp/treasure18.javap
          grep -q 'onPokerodReel' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java
          grep -q 'averageTopThree' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/dungeon/DungeonTrainerService.java

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.18*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.18+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.18-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.18+1.21.1.jar Chainacobblemon-0.3.0-alpha.18-source.zip > SHA256SUMS-0.3.0-alpha.18.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.18
          path: /tmp/out/*
