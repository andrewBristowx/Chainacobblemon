name: Build Chainacobblemon 0.3.0-alpha.20 Treasure Return Fix

on:
  push:
    branches:
      - release/0.3.0-alpha.20
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.19 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9297009037/zip' \
            -o /tmp/alpha19-artifact.zip
          rm -rf /tmp/alpha19-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha19-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha19-artifact.zip -d /tmp/alpha19-artifact
          srczip="$(find /tmp/alpha19-artifact -name 'Chainacobblemon-0.3.0-alpha.19-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply exact alpha.20 overlay
        shell: bash
        run: |
          set -euxo pipefail
          cp ci/alpha20/part00 /tmp/alpha20-overlay.b64
          base64 -d /tmp/alpha20-overlay.b64 > /tmp/alpha20-overlay.tar.gz
          echo '09e3331034f89917025dfc32532803430a8bb4cd3803875a292b9fc384e090cb  /tmp/alpha20-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/alpha20-overlay.tar.gz -C /tmp/chainacobblemon
          grep -q 'mod_version=0.3.0-alpha.20+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Compile Chainacobblemon alpha.20
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.20 Treasure return fix
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.20*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.20' fabric.mod.json
          grep -q 'active.type == ChainaEventType.TREASURE' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java
          grep -q 'Do not teleport/clear Treasure here' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/ChainaEventManager.java
          grep -q 'Force the destination chunk' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java
          grep -q 'target.getChunk(chunkX, chunkZ)' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.20*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.20+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.20-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.20+1.21.1.jar Chainacobblemon-0.3.0-alpha.20-source.zip > SHA256SUMS-0.3.0-alpha.20.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.20
          path: /tmp/out/*
