name: Build Chainacobblemon 0.4.0-alpha.31 Watchdog Safe Pregen

on:
  push:
    branches:
      - release/0.4.0-alpha.31
    paths:
      - 'ci/040a31/**'
      - '.github/workflows/040a31-watchdog-safe-pregen.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.31
        run: bash ci/040a31/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.31-Watchdog-Safe-Pregen
          path: /tmp/alpha31-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.31 to dist
        run: |
          set -euxo pipefail
          rm -rf dist/alpha31
          mkdir -p dist/alpha31
          cp /tmp/alpha31-out/* dist/alpha31/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha31/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha31/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha31
          git commit -m 'build: publish verified alpha31 artifacts'
          git push origin HEAD:release/0.4.0-alpha.31
