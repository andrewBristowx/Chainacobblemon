name: Build Chainacobblemon 0.4.0-alpha.15 Polish

on:
  push:
    branches:
      - release/0.4.0-alpha.15
    paths:
      - 'ci/040a15/**'
      - '.github/workflows/040a15-alpha15-polish.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore verified alpha.14 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/a14 /tmp/chainacobblemon
          mkdir -p /tmp/a14 /tmp/chainacobblemon
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9346046580/zip" \
            -o /tmp/a14/artifact.zip
          unzip -q /tmp/a14/artifact.zip -d /tmp/a14
          srczip="$(find /tmp/a14 -maxdepth 1 -type f -name '*source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon
          test -f /tmp/chainacobblemon/gradlew

      - name: Apply alpha.15 tested-server improvements
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/040a15/alpha15.patch.b64.part0 \
              ci/040a15/alpha15.patch.b64.part1 \
              ci/040a15/alpha15.patch.b64.part2 \
              ci/040a15/alpha15.patch.b64.part3 \
              ci/040a15/alpha15.patch.b64.part4 | base64 -d > /tmp/alpha15.patch
          cd /tmp/chainacobblemon
          patch -p1 --forward --batch < /tmp/alpha15.patch
          grep -q 'mod_version=0.4.0-alpha.15+1.21.1' gradle.properties
          grep -q '0.4.0-alpha.15+1.21.1' src/main/java/com/andrewbristowx/chainacobblemon/Chainacobblemon.java
          grep -q 'configVersion = 17' src/main/java/com/andrewbristowx/chainacobblemon/config/ChainacobblemonConfig.java
          grep -q 'PASE PREMIUM ACTIVO' src/client/java/com/andrewbristowx/chainacobblemon/client/rewards/BattlePassScreen.java
          grep -q 'cleanuporphans' src/main/java/com/andrewbristowx/chainacobblemon/protection/ProtectionRecoveryCommands.java
          grep -q 'treasure_gacha_ticket' src/main/java/com/andrewbristowx/chainacobblemon/shop/ShopCatalog.java

      - name: Compile alpha.15 on Java 21
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify alpha.15 JAR contract
        shell: bash
        run: |
          set -euxo pipefail
          jarfile="$(find /tmp/chainacobblemon/build/libs -maxdepth 1 -type f -name 'Chainacobblemon-0.4.0-alpha.15+1.21.1*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -s "$jarfile"
          unzip -p "$jarfile" fabric.mod.json | grep -q '0.4.0-alpha.15+1.21.1'
          jar tf "$jarfile" | grep -q 'com/andrewbristowx/chainacobblemon/protection/ProtectionClaimRecoveryService.class'
          jar tf "$jarfile" | grep -q 'com/andrewbristowx/chainacobblemon/protection/ProtectionRecoveryCommands.class'
          javap -classpath "$jarfile" -p com.andrewbristowx.chainacobblemon.progress.JobLimitRules > /tmp/jobs.txt
          javap -classpath "$jarfile" -p com.andrewbristowx.chainacobblemon.events.ChainaEventManager > /tmp/events.txt
          grep -q 'forGroups' /tmp/jobs.txt
          grep -q 'status' /tmp/events.txt

      - name: Package alpha.15
        shell: bash
        run: |
          set -euxo pipefail
          OUT=/tmp/alpha15-out
          rm -rf "$OUT" && mkdir -p "$OUT"
          jarfile="$(find /tmp/chainacobblemon/build/libs -maxdepth 1 -type f -name 'Chainacobblemon-0.4.0-alpha.15+1.21.1*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" "$OUT/Chainacobblemon-0.4.0-alpha.15+1.21.1.jar"
          cd /tmp/chainacobblemon
          zip -qr "$OUT/Chainacobblemon-0.4.0-alpha.15-source.zip" . -x './.gradle/*' './build/*'
          cat > "$OUT/README-ALPHA15.txt" <<'EOF'
          Chainacobblemon 0.4.0-alpha.15 - Server test polish

          Changes from the validated alpha.14 test session:
          - Rank hierarchy/colors for CHAINA, ADMIN, MOD, VIP and SUB tiers.
          - Job limits: normal 2, SUB I/II 3, VIP/MOD/SUB III 4, ADMIN/CHAINA all.
          - Premium Battle Pass for SUB I/II/III, VIP, MOD, ADMIN and CHAINA.
          - Weekly Initial/SUB I/SUB II/SUB III/VIP/MOD kits.
          - Treasure and Chaina Gacha tickets added to Poke Mart.
          - Basic/Advanced/Epic/Legendary protection cores added to Poke Mart.
          - Protection claim removal recovery retries plus admin orphan cleanup command.
          - Beauty test mode no longer rewards the sole tester; lighter background.
          - Hologram per-player refresh after login plus 60-second safety refresh.
          - Natural events start around 60 min, then 60-90 min, with drought protection.
          - Manual/test events no longer reset the natural-event timer.

          Still intentionally pending a later validated pass:
          - Curated strategic Tower movesets/AI tuning.
          - Gym/Elite Four/Champion Mega/Tera/Dynamax restrictions.
          These need runtime validation against the installed RCT/Mega Showdown stack rather than guessing APIs.
          EOF
          cd "$OUT"
          sha256sum Chainacobblemon-0.4.0-alpha.15+1.21.1.jar Chainacobblemon-0.4.0-alpha.15-source.zip > SHA256SUMS-0.4.0-alpha.15.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.15-Polish
          path: /tmp/alpha15-out/*
          if-no-files-found: error
          retention-days: 90
