name: Build Chainacobblemon 0.4.0-alpha.21 Native RCT Spawners

on:
  push:
    branches:
      - release/0.4.0-alpha.21
    paths:
      - 'ci/040a21/**'
      - '.github/workflows/040a21-native-rct-spawners.yml'
  pull_request:
    branches:
      - release/0.4.0-alpha.20
    paths:
      - 'ci/040a21/**'
      - '.github/workflows/040a21-native-rct-spawners.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.21
        run: bash ci/040a21/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.21-Native-RCT-Spawners
          path: /tmp/alpha21-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.21 to dist
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          rm -rf dist/alpha21
          mkdir -p dist/alpha21
          cp /tmp/alpha21-out/* dist/alpha21/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha21/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha21/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha21
          git commit -m 'build: publish verified alpha21 artifacts'
          git push origin HEAD:release/0.4.0-alpha.21
