name: Build and publish alpha.24 debug artifact

on:
  push:
    branches:
      - release/0.3.0-alpha.24
    paths-ignore:
      - 'dist/alpha24/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.23 source and overlay alpha.24
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9302505012/zip' \
            -o /tmp/alpha23-artifact.zip
          rm -rf /tmp/alpha23-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha23-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha23-artifact.zip -d /tmp/alpha23-artifact
          srczip="$(find /tmp/alpha23-artifact -name 'Chainacobblemon-0.3.0-alpha.23-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon
          cat ci/alpha24/part00 ci/alpha24/part01 ci/alpha24/part02 ci/alpha24/part03 ci/alpha24/part04 ci/alpha24/part05 ci/alpha24/part06 > /tmp/alpha24-overlay.b64
          test "$(wc -c < /tmp/alpha24-overlay.b64)" -eq 46664
          echo 'f61751bd7268c4c487b0fa8c221a79e5b848b75f31c65fea91793cc7cc32cbe2  /tmp/alpha24-overlay.b64' | sha256sum -c -
          base64 -d /tmp/alpha24-overlay.b64 > /tmp/alpha24-overlay.tar.gz
          echo '53856edcdf7f58941faaccded74c6ee5061d7f90642d47016e6fb473e5797bae  /tmp/alpha24-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/alpha24-overlay.tar.gz -C /tmp/chainacobblemon
          python ci/alpha24/hotfix.py
          sed -i 's/mod_version=0.3.0-alpha.23+1.21.1/mod_version=0.3.0-alpha.24+1.21.1/' /tmp/chainacobblemon/gradle.properties

      - name: Compile and package
        id: compile
        shell: bash
        run: |
          set +e
          cd /tmp/chainacobblemon
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon 2>&1 | tee /tmp/alpha24-build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/publish
          cp /tmp/alpha24-build.log /tmp/publish/BUILD_LOG.txt
          cp src/main/java/com/andrewbristowx/chainacobblemon/events/FishingMinigameService.java /tmp/publish/FishingMinigameService.java
          if [ "$rc" -eq 0 ]; then
            jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.24*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
            if [ -z "$jarfile" ]; then
              echo 'FAILURE: build returned 0 but remapped alpha.24 jar was not found.' > /tmp/publish/BUILD_STATUS.txt
              rc=88
            else
              cp "$jarfile" /tmp/publish/Chainacobblemon-0.3.0-alpha.24+1.21.1.jar
              zip -qr /tmp/publish/Chainacobblemon-0.3.0-alpha.24-source.zip . -x './.gradle/*' './build/*'
              cd /tmp/publish
              sha256sum Chainacobblemon-0.3.0-alpha.24+1.21.1.jar Chainacobblemon-0.3.0-alpha.24-source.zip > SHA256SUMS-0.3.0-alpha.24.txt
              echo 'SUCCESS' > BUILD_STATUS.txt
            fi
          else
            echo "FAILURE rc=$rc" > /tmp/publish/BUILD_STATUS.txt
          fi
          echo "$rc" > /tmp/publish/BUILD_RC.txt
          exit 0

      - name: Publish build result to branch
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist/alpha24
          mkdir -p dist/alpha24
          cp -a /tmp/publish/. dist/alpha24/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha24
          git commit -m 'ci: publish alpha.24 build result [skip ci]' || true
          git push origin HEAD:release/0.3.0-alpha.24

      - name: Fail workflow if compile failed
        shell: bash
        run: |
          rc="$(cat /tmp/publish/BUILD_RC.txt)"
          test "$rc" -eq 0
