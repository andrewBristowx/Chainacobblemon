name: Build Chainacobblemon 0.3.0-alpha.22 Treasure Parkour

on:
  push:
    branches:
      - release/0.3.0-alpha.22
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.21 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9298653364/zip' \
            -o /tmp/alpha21-artifact.zip
          rm -rf /tmp/alpha21-artifact /tmp/chainacobblemon
          mkdir -p /tmp/alpha21-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha21-artifact.zip -d /tmp/alpha21-artifact
          srczip="$(find /tmp/alpha21-artifact -name 'Chainacobblemon-0.3.0-alpha.21-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply alpha.22 Treasure parkour
        shell: bash
        run: |
          set -euxo pipefail
          target='/tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java'
          base64 -d ci/alpha22/TreasureHuntService.java.gz.b64 | gzip -dc > "$target"
          echo '4be324d9bf650337bc75714e2ea679fad1921f43aa9fa4d1300819ac99fad1df  '"$target" | sha256sum -c -
          sed -i 's/mod_version=0.3.0-alpha.21+1.21.1/mod_version=0.3.0-alpha.22+1.21.1/' /tmp/chainacobblemon/gradle.properties
          grep -q 'mod_version=0.3.0-alpha.22+1.21.1' /tmp/chainacobblemon/gradle.properties

      - name: Compile Chainacobblemon alpha.22
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon

      - name: Verify alpha.22 Treasure parkour
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.22*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          test -n "$jarfile"
          rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
          cd /tmp/jarcheck
          jar xf "/tmp/chainacobblemon/$jarfile"
          grep -q '0.3.0-alpha.22' fabric.mod.json
          src='/tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/events/treasure/TreasureHuntService.java'
          grep -q 'buildParkour(world, run)' "$src"
          grep -q 'PARKOUR_RESET_Y' "$src"
          grep -q 'Fallaste el salto' "$src"
          grep -q 'player.fallDistance = 0.0F' "$src"
          grep -q 'ParticleTypes.PORTAL' "$src"
          grep -q 'parkourPlatforms' "$src"
          grep -q 'ballFloor' "$src"
          grep -q 'case 1 -> 6' "$src"
          grep -q 'default -> 18' "$src"

      - name: Package source and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/chainacobblemon
          rm -rf /tmp/out && mkdir -p /tmp/out
          jarfile="$(find build/libs -maxdepth 1 -type f -name '*alpha.22*.jar' ! -name '*sources*' ! -name '*dev*' -print -quit)"
          cp "$jarfile" /tmp/out/Chainacobblemon-0.3.0-alpha.22+1.21.1.jar
          zip -qr /tmp/out/Chainacobblemon-0.3.0-alpha.22-source.zip . -x './.gradle/*' './build/*'
          cd /tmp/out
          sha256sum Chainacobblemon-0.3.0-alpha.22+1.21.1.jar Chainacobblemon-0.3.0-alpha.22-source.zip > SHA256SUMS-0.3.0-alpha.22.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.22
          path: /tmp/out/*
