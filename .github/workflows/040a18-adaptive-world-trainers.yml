name: Build Chainacobblemon 0.4.0-alpha.18 Adaptive World Trainers

on:
  push:
    branches:
      - release/0.4.0-alpha.18
    paths:
      - 'ci/040a18/**'
      - '.github/workflows/040a18-adaptive-world-trainers.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.18
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/040a18/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.18-Adaptive-World-Trainers
          path: /tmp/alpha18-out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified alpha.18 to dist
        run: |
          set -euxo pipefail
          rm -rf dist/alpha18
          mkdir -p dist/alpha18
          cp /tmp/alpha18-out/* dist/alpha18/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha18/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha18/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha18
          git commit -m 'build: publish verified alpha18 artifacts'
          git push origin HEAD:release/0.4.0-alpha.18
