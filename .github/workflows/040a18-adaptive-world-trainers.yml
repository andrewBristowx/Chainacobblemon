name: Build Chainacobblemon 0.4.0-alpha.18 Adaptive World Trainers

on:
  push:
    branches:
      - release/0.4.0-alpha.18
    paths:
      - 'ci/040a18/**'
      - '.github/workflows/040a18-adaptive-world-trainers.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package alpha.18
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/040a18/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.18-Adaptive-World-Trainers
          path: /tmp/alpha18-out/*
          if-no-files-found: error
          retention-days: 90
