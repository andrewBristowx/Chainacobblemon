name: Build Chainacobblemon 0.3.0-alpha.11 Tower level/music fix

on:
  push:
    branches:
      - release/0.3.0-alpha.11
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore exact alpha.10 source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/andrewBristowx/Chainacobblemon/actions/artifacts/9274267195/zip' \
            -o /tmp/alpha10-artifact.zip
          mkdir -p /tmp/alpha10-artifact /tmp/chainacobblemon
          unzip -q /tmp/alpha10-artifact.zip -d /tmp/alpha10-artifact
          srczip="$(find /tmp/alpha10-artifact -name 'Chainacobblemon-0.3.0-alpha.10-source.zip' -print -quit)"
          test -n "$srczip"
          unzip -q "$srczip" -d /tmp/chainacobblemon

      - name: Apply alpha.11 Tower fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/alpha11/apply_alpha11.py
          grep -q 'mod_version=0.3.0-alpha.11+1.21.1' /tmp/chainacobblemon/gradle.properties
          grep -q 'Rival generado alrededor de Nv.' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/npc/NpcBattleService.java
          grep -q 'SoundCategory.MASTER' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/tower/ChallengeTowerService.java
          grep -q 'StopSoundS2CPacket(null, SoundCategory.MUSIC)' /tmp/chainacobblemon/src/main/java/com/andrewbristowx/chainacobblemon/tower/ChallengeTowerService.java

      - name: Compile Chainacobblemon alpha.11
        working-directory: /tmp/chainacobblemon
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew clean build -x test --no-daemon --stacktrace

      - name: Verify alpha.11 jar
        shell: bash
        run: |
          set -euxo pipefail
          src=/tmp/chainacobblemon
          jar="$(find "$src/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar"
          unzip -p "$jar" fabric.mod.json | grep -q '0.3.0-alpha.11+1.21.1'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/tower/ChallengeTowerService.class'
          unzip -l "$jar" | grep -q 'com/andrewbristowx/chainacobblemon/npc/NpcBattleService.class'
          unzip -l "$jar" | grep -q 'assets/chainacobblemon/sounds/tower/badge_rush.ogg'
          mkdir -p /tmp/release
          cp "$jar" '/tmp/release/Chainacobblemon-0.3.0-alpha.11+1.21.1.jar'
          (cd "$src" && zip -qr '/tmp/release/Chainacobblemon-0.3.0-alpha.11-source.zip' . -x '.gradle/*' 'build/*')
          sha256sum \
            /tmp/release/Chainacobblemon-0.3.0-alpha.11+1.21.1.jar \
            /tmp/release/Chainacobblemon-0.3.0-alpha.11-source.zip \
            > /tmp/release/SHA256SUMS-0.3.0-alpha.11.txt
          cat /tmp/release/SHA256SUMS-0.3.0-alpha.11.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.3.0-alpha.11
          path: /tmp/release/*
