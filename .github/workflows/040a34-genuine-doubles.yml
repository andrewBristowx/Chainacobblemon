name: Build Chainacobblemon 0.4.0-alpha.34 Genuine Doubles

on:
  push:
    branches:
      - release/0.4.0-alpha.34
    paths:
      - 'ci/040a34/**'
      - '.github/workflows/040a34-genuine-doubles.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and package alpha.34
        run: bash ci/040a34/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Chainacobblemon-0.4.0-alpha.34-Genuine-Doubles
          path: /tmp/alpha34-out/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified alpha.34 to dist
        run: |
          set -euxo pipefail
          rm -rf dist/alpha34
          mkdir -p dist/alpha34
          cp /tmp/alpha34-out/* dist/alpha34/
          printf '%s\n' "$GITHUB_RUN_ID" > dist/alpha34/RUN_ID.txt
          printf 'SUCCESS\n' > dist/alpha34/BUILD_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alpha34
          git commit -m 'build: publish verified alpha34 artifacts'
          git push origin HEAD:release/0.4.0-alpha.34
